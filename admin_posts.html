<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Posts — SPIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #070b10;
            --bg-surface: #0d1520;
            --bg-card: rgba(20, 32, 48, 0.7);
            --bg-glass: rgba(13, 21, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 168, 132, 0.3);
            --primary: #00a884;
            --primary-hover: #00c29a;
            --primary-glow: rgba(0, 168, 132, 0.4);
            --accent: #0ea5e9;
            --error: #f43f5e;
            --error-glow: rgba(244, 63, 94, 0.4);
            --success: #00a884;
            --success-glow: rgba(0, 168, 132, 0.4);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gold: #ffd700;
        }

        body.light-mode {
            --bg-deep: #f0f4fa;
            --bg-surface: #e8edf4;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-glass: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f1824;
            --text-muted: #5a6e8a;
            --border-glow: rgba(0, 168, 132, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; min-height: 100vh; overflow-x: hidden; background-color: var(--bg-deep); color: var(--text-main); font-family: var(--font-main); }
        body { display: flex; flex-direction: column; align-items: center; position: relative; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(0,168,132,0.03) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(14,165,233,0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .admin-header {
            width: 100%; max-width: 1200px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-glass); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            gap: 12px;
            min-height: 64px;
        }
        .header-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .header-right { display: flex; align-items: center; gap: 8px; }

        .back-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2vw, 0.85rem);
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            transition: var(--transition);
            font-family: var(--font-main);
            min-height: 40px;
            display: flex;
            align-items: center;
            touch-action: manipulation;
        }
        .back-btn:active { transform: scale(0.95); }
        .back-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); border-color: rgba(255,255,255,0.15); }

        .logo {
            font-size: clamp(1rem, 3.5vw, 1.3rem);
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            text-decoration: none;
        }

        .admin-badge {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
            border: 1px solid rgba(255,215,0,0.2);
            color: var(--gold);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: clamp(0.6rem, 1.8vw, 0.7rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header-nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(1rem, 3vw, 1.15rem);
            padding: 6px 10px;
            border-radius: 8px;
            transition: var(--transition);
            cursor: pointer;
            min-height: 36px;
            display: flex;
            align-items: center;
            touch-action: manipulation;
        }
        .header-nav-link:active { transform: scale(0.92); }
        .header-nav-link:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* ===== MAIN CONTENT ===== */
        .admin-main {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: clamp(16px, 3vw, 24px) 16px;
            width: 100%; max-width: 1200px; margin: auto;
            gap: clamp(16px, 3vw, 20px);
            position: relative;
            z-index: 1;
        }

        .page-title {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .page-title h1 {
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title .post-count {
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ===== CONTROLS ===== */
        .admin-controls {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-search {
            flex: 1;
            min-width: 180px;
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: clamp(0.8rem, 2vw, 0.85rem);
            outline: none;
            transition: var(--transition);
            min-height: 44px;
        }
        .admin-search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,168,132,0.12); }
        .admin-search::placeholder { color: var(--text-muted); }

        .admin-filter {
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: clamp(0.8rem, 2vw, 0.85rem);
            outline: none;
            cursor: pointer;
            min-height: 44px;
            min-width: 130px;
            transition: var(--transition);
        }
        .admin-filter:focus { border-color: var(--primary); }
        .admin-filter option { background: var(--bg-surface); color: var(--text-main); }

        .admin-sort {
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: clamp(0.8rem, 2vw, 0.85rem);
            outline: none;
            cursor: pointer;
            min-height: 44px;
            min-width: 130px;
            transition: var(--transition);
        }
        .admin-sort:focus { border-color: var(--primary); }
        .admin-sort option { background: var(--bg-surface); color: var(--text-main); }

        /* ===== BULK ACTIONS ===== */
        .bulk-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            display: none;
        }
        .bulk-actions.visible { display: flex; }
        .bulk-actions .bulk-count {
            font-size: clamp(0.75rem, 1.8vw, 0.82rem);
            color: var(--text-muted);
            margin-right: 4px;
        }
        .bulk-actions .bulk-count strong { color: var(--text-main); }

        .btn-sm {
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.03);
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: clamp(0.65rem, 1.6vw, 0.72rem);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-sm:active { transform: scale(0.95); }
        .btn-sm:hover { background: rgba(255,255,255,0.06); color: var(--text-main); border-color: rgba(255,255,255,0.12); }
        .btn-sm.danger:hover { background: rgba(244,63,94,0.12); color: var(--error); border-color: rgba(244,63,94,0.2); }
        .btn-sm.success:hover { background: rgba(0,168,132,0.12); color: var(--success); border-color: rgba(0,168,132,0.2); }
        .btn-sm.primary { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-sm.primary:hover { background: var(--primary-hover); }

        /* ===== LIST ITEMS ===== */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .list-item {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: clamp(12px, 2.5vw, 16px);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .list-item:hover { border-color: rgba(255,255,255,0.12); }
        .list-item .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            flex-wrap: wrap;
        }
        .list-item .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 120px;
        }
        .list-item .item-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }
        .list-item .item-author {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
        }
        .list-item .item-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00796b, var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 0.8rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .list-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .list-item .item-name { font-weight: 700; font-size: clamp(0.82rem, 2vw, 0.9rem); }
        .list-item .item-email { font-size: clamp(0.7rem, 1.6vw, 0.78rem); color: var(--text-muted); }
        .list-item .item-content {
            font-size: clamp(0.82rem, 2vw, 0.88rem);
            color: var(--text-main);
            line-height: 1.4;
            word-break: break-word;
            padding: 4px 0 2px 38px;
        }
        .list-item .item-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: clamp(0.65rem, 1.6vw, 0.72rem);
            color: var(--text-muted);
            padding-left: 38px;
        }
        .list-item .item-meta span { display: flex; align-items: center; gap: 4px; }
        .list-item .item-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding-left: 38px;
            margin-top: 4px;
        }

        .badge-status {
            font-size: clamp(0.55rem, 1.4vw, 0.6rem);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .badge-status.hidden { background: rgba(94,94,94,0.15); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05); }
        .badge-status.visible { background: rgba(0,168,132,0.15); color: var(--success); border: 1px solid rgba(0,168,132,0.2); }
        .badge-status.suspended { background: rgba(244,63,94,0.15); color: var(--error); border: 1px solid rgba(244,63,94,0.2); }
        .badge-status.reported { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 2.5rem; display: block; margin-bottom: 12px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3,7,13,0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 8000; display: none; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; transition: opacity 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .modal-card {
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: clamp(18px, 4vw, 22px);
            padding: clamp(18px, 4vw, 24px);
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            animation: modalSlideUp 0.35s cubic-bezier(0.16,1,0.3,1);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalSlideUp {
            0% { opacity: 0; transform: translateY(24px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-card .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 12px;
        }
        .modal-card .modal-title {
            font-size: clamp(1rem, 3vw, 1.15rem);
            font-weight: 800;
        }
        .modal-card .modal-close {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 0.9rem;
            touch-action: manipulation;
        }
        .modal-card .modal-close:active { transform: scale(0.9); }
        .modal-card .modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

        .modal-card .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-card .modal-body .post-preview {
            background: rgba(7,11,16,0.4);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 120px;
            overflow-y: auto;
            border-left: 3px solid var(--primary);
        }
        .modal-card textarea {
            width: 100%;
            background: rgba(7,11,16,0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: clamp(0.82rem, 2vw, 0.88rem);
            outline: none;
            resize: vertical;
            min-height: 80px;
            transition: var(--transition);
        }
        .modal-card textarea:focus { border-color: var(--primary); }
        .modal-card .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .modal-card .modal-actions .btn-confirm {
            flex: 1; min-width: 80px; padding: clamp(8px, 2.5vw, 12px);
            border-radius: 12px; border: none; font-family: var(--font-main);
            font-weight: 700; font-size: clamp(0.75rem, 2.2vw, 0.85rem);
            cursor: pointer; transition: var(--transition);
            touch-action: manipulation; min-height: 40px;
        }
        .modal-card .modal-actions .btn-confirm:active { transform: scale(0.95); }
        .modal-card .modal-actions .btn-confirm.primary { background: var(--primary); color: white; box-shadow: 0 0 16px var(--primary-glow); }
        .modal-card .modal-actions .btn-confirm.primary:hover { background: var(--primary-hover); }
        .modal-card .modal-actions .btn-confirm.danger { background: var(--error); color: white; box-shadow: 0 0 16px var(--error-glow); }
        .modal-card .modal-actions .btn-confirm.danger:hover { background: #e11d48; }
        .modal-card .modal-actions .btn-confirm.secondary { background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--border-color); }
        .modal-card .modal-actions .btn-confirm.secondary:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed; top: 28px; left: 50%;
            transform: translateX(-50%) translateY(-30px); z-index: 9999;
            width: calc(100% - 32px); max-width: 420px;
            opacity: 0; visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .toast-container.active {
            opacity: 1; visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast-content {
            background: var(--bg-glass); backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(10px, 2.5vw, 14px) clamp(14px, 4vw, 18px);
            display: flex; align-items: center; gap: clamp(8px, 2.5vw, 14px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            position: relative; overflow: hidden;
            animation: toastSlideIn 0.5s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes toastSlideIn {
            0% { opacity: 0; transform: translateY(-16px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastSlideOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-16px) scale(0.95); }
        }
        .toast-container.removing .toast-content { animation: toastSlideOut 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }

        .toast-icon-wrapper {
            width: clamp(32px, 8vw, 38px); height: clamp(32px, 8vw, 38px);
            min-width: clamp(32px, 8vw, 38px); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            font-weight: 800; flex-shrink: 0;
            position: relative;
        }
        .toast-icon-wrapper::before {
            content: ''; position: absolute; inset: -2px; border-radius: 14px;
            background: var(--toast-glow-color); opacity: 0.12; filter: blur(6px);
        }
        .toast-icon-wrapper .icon { position: relative; z-index: 1; }

        .toast-container.success { --toast-glow-color: rgba(0,168,132,0.5); }
        .toast-container.success .toast-icon-wrapper {
            background: rgba(0,168,132,0.12);
            border: 1px solid rgba(0,168,132,0.25);
            color: var(--success);
        }
        .toast-container.error { --toast-glow-color: rgba(244,63,94,0.5); }
        .toast-container.error .toast-icon-wrapper {
            background: rgba(244,63,94,0.12);
            border: 1px solid rgba(244,63,94,0.25);
            color: var(--error);
        }
        .toast-container.warning { --toast-glow-color: rgba(245,158,11,0.5); }
        .toast-container.warning .toast-icon-wrapper {
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.25);
            color: var(--warning);
        }

        .toast-text-group { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .toast-title { font-size: clamp(0.7rem, 2.2vw, 0.8rem); font-weight: 800; color: var(--text-main); line-height: 1.2; }
        .toast-message { font-size: clamp(0.65rem, 2vw, 0.72rem); font-weight: 500; color: var(--text-muted); line-height: 1.3; }
        .toast-close-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: clamp(22px, 5vw, 26px);
            height: clamp(22px, 5vw, 26px);
            min-width: clamp(22px, 5vw, 26px);
            border-radius: 50%;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            font-size: 0.6rem; transition: var(--transition);
            flex-shrink: 0; touch-action: manipulation;
        }
        .toast-close-btn:active { transform: scale(0.9); }
        .toast-close-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-main); }
        .toast-progress {
            position: absolute; bottom: 0; left: 0; height: 2px;
            background: var(--toast-glow-color); border-radius: 0 0 16px 16px;
            width: 100%; animation: toastProgress 3s linear forwards;
        }
        @keyframes toastProgress { 0% { width: 100%; } 100% { width: 0%; } }

        /* ===== CONFIRMATION ===== */
        .confirm-modal-overlay {
            position: fixed; inset: 0; background: rgba(3,7,13,0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const PRIMARY_ADMIN = "eletexjoeytex@gmail.com";

        let currentUser = null;
        let toastTimeout = null;
        let unsubscribePosts = null;
        let allPosts = [];
        let selectedPosts = new Set();
        let currentEditPostId = null;

        // ===== TOAST =====
        function showToast(message, type = 'success', title = '') {
            const toast = document.getElementById('globalToast');
            const toastTitle = document.getElementById('toastTitle');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }

            toast.className = 'toast-container';
            const titles = { success: '✓ Success', error: '✕ Error', warning: '⚠️ Warning' };
            const icons = { success: '✓', error: '✕', warning: '⚠️' };

            toastTitle.textContent = title || titles[type] || 'Notification';
            toastMessage.textContent = message;
            toastIcon.textContent = icons[type] || '✓';

            void toast.offsetWidth;
            toast.classList.add(type, 'active');

            toastTimeout = setTimeout(() => { dismissToast(); }, 3500);
        }

        function dismissToast() {
            const toast = document.getElementById('globalToast');
            if (!toast.classList.contains('active')) return;
            toast.classList.add('removing');
            setTimeout(() => {
                toast.className = 'toast-container';
                toast.classList.remove('removing');
                if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }
            }, 400);
        }

        // ===== CONFIRMATION =====
        let pendingConfirm = null;

        function showConfirmModal(options) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('confirmModalOverlay');
                const modal = document.getElementById('confirmModal');
                const icon = document.getElementById('confirmModalIcon');
                const title = document.getElementById('confirmModalTitle');
                const message = document.getElementById('confirmModalMessage');
                const details = document.getElementById('confirmModalDetails');
                const confirmBtn = document.getElementById('confirmModalConfirm');
                const cancelBtn = document.getElementById('confirmModalCancel');

                modal.className = 'confirm-modal ' + (options.type || 'warning');
                icon.textContent = options.icon || '⚠️';
                title.textContent = options.title || 'Are you sure?';
                message.textContent = options.message || 'This action cannot be undone.';

                if (options.details) {
                    details.innerHTML = options.details;
                    details.style.display = 'block';
                } else {
                    details.style.display = 'none';
                }

                confirmBtn.textContent = options.confirmText || 'Confirm';
                confirmBtn.className = 'btn-confirm ' + (options.confirmType || 'danger');
                cancelBtn.textContent = options.cancelText || 'Cancel';

                pendingConfirm = { resolve };
                overlay.classList.add('active');
            });
        }

        function closeConfirmModal() {
            document.getElementById('confirmModalOverlay').classList.remove('active');
        }

        function handleConfirm() {
            if (pendingConfirm) {
                pendingConfirm.resolve(true);
                pendingConfirm = null;
            }
            closeConfirmModal();
        }

        function handleCancel() {
            if (pendingConfirm) {
                pendingConfirm.resolve(false);
                pendingConfirm = null;
            }
            closeConfirmModal();
        }

        document.getElementById('confirmModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) handleCancel();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') handleCancel();
        });

        // ===== HELPERS =====
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            let date;
            if (timestamp instanceof Timestamp) {
                date = timestamp.toDate();
            } else if (timestamp?.toDate) {
                date = timestamp.toDate();
            } else {
                date = new Date(timestamp);
            }
            if (isNaN(date.getTime())) return 'Just now';
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 5) return 'Just now';
            if (diff < 60) return `${diff}s ago`;
            const minutes = Math.floor(diff / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        // ===== NAVIGATION =====
        window.goToFeed = function() { window.location.href = "feed.html"; };
        window.goToProfile = function() { window.location.href = "profile.html"; };
        window.goToAdminHub = function() { window.location.href = "administrator.html"; };

        window.signOutUser = async function() {
            const confirmed = await showConfirmModal({
                type: 'warning',
                icon: '🚪',
                title: 'Sign Out',
                message: 'Are you sure you want to sign out?',
                confirmText: 'Sign Out',
                confirmType: 'warning',
                cancelText: 'Stay Signed In'
            });
            if (!confirmed) return;
            try {
                await signOut(auth);
                window.location.href = "index.html";
            } catch (err) {
                console.error("Error signing out:", err);
                showToast("Failed to sign out.", "error", "Sign Out Failed");
            }
        };

        // ===== GET MUTED WORDS =====
        function getMutedWords() {
            try {
                const data = localStorage.getItem('spikeMutedWords');
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        // ===== GET BLOCKED USERS =====
        function getBlockedUsers() {
            try {
                const data = localStorage.getItem('spikeBlockedUsers');
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        // ===== SHOULD HIDE POST =====
        function shouldHidePost(post) {
            if (!post) return true;
            const mutedWords = getMutedWords();
            const blockedUsers = getBlockedUsers();
            
            if (post.authorUid && blockedUsers.includes(post.authorUid)) return true;
            
            if (post.content && mutedWords.length > 0) {
                const contentLower = post.content.toLowerCase();
                for (const word of mutedWords) {
                    if (contentLower.includes(word.toLowerCase())) return true;
                }
            }
            return false;
        }

        // ===== RENDER POSTS =====
        function renderPosts() {
            const container = document.getElementById('postsList');
            const searchTerm = document.getElementById('postsSearch').value.toLowerCase();
            const filterType = document.getElementById('postsFilter').value;
            const sortType = document.getElementById('postsSort').value;

            let filtered = [...allPosts];
            
            // Apply filters
            if (filterType === 'hidden') {
                filtered = filtered.filter(p => p.hidden === true);
            } else if (filterType === 'visible') {
                filtered = filtered.filter(p => p.hidden !== true);
            } else if (filterType === 'reported') {
                // This would need a reports collection join - for now show all
                // In production, you'd check if post has pending reports
            }
            
            // Apply search
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    (p.content || '').toLowerCase().includes(searchTerm) ||
                    (p.authorName || '').toLowerCase().includes(searchTerm)
                );
            }
            
            // Apply sort
            if (sortType === 'newest') {
                filtered.sort((a, b) => {
                    const aTime = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
                    const bTime = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
                    return bTime - aTime;
                });
            } else if (sortType === 'oldest') {
                filtered.sort((a, b) => {
                    const aTime = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
                    const bTime = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
                    return aTime - bTime;
                });
            } else if (sortType === 'mostLiked') {
                filtered.sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0));
            } else if (sortType === 'mostCommented') {
                filtered.sort((a, b) => (b.comments?.length || 0) - (a.comments?.length || 0));
            }

            // Update count
            document.getElementById('postCount').textContent = `${filtered.length} posts`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📭</span>
                        <p>No posts found matching your criteria.</p>
                    </div>
                `;
                updateBulkActions();
                return;
            }

            let html = '';
            filtered.forEach(post => {
                const isHidden = post.hidden === true;
                const isChecked = selectedPosts.has(post.id);
                const avatar = post.authorAvatar || '';
                const avatarHTML = avatar ? 
                    `<img src="${avatar}" alt="">` : 
                    getInitials(post.authorName || 'User');
                
                // Check if post should be hidden by muted words
                const isMuted = shouldHidePost(post);

                html += `
                    <div class="list-item" id="post-${post.id}">
                        <div class="item-header">
                            <div class="item-left">
                                <input type="checkbox" class="item-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelectPost('${post.id}')">
                                <div class="item-author" onclick="viewPost('${post.id}')">
                                    <div class="item-avatar">${avatarHTML}</div>
                                    <div>
                                        <div class="item-name">${escapeHTML(post.authorName || 'User')}</div>
                                        <div class="item-email">${formatTimeAgo(post.createdAt)}</div>
                                    </div>
                                </div>
                            </div>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                                ${isMuted ? '<span class="badge-status reported">🔇 Muted</span>' : ''}
                                <span class="badge-status ${isHidden ? 'hidden' : 'visible'}">${isHidden ? '🔒 Hidden' : '✅ Visible'}</span>
                            </div>
                        </div>
                        <div class="item-content">${escapeHTML(post.content || '')}</div>
                        <div class="item-meta">
                            <span>❤️ ${post.likes?.length || 0}</span>
                            <span>💬 ${post.comments?.length || 0}</span>
                            ${post.imageUrl ? '<span>📷</span>' : ''}
                            ${post.videoUrl ? '<span>🎬</span>' : ''}
                            ${post.isRepost ? '<span>🔁 Repost</span>' : ''}
                            ${post.hidden ? '<span>🔒 Hidden</span>' : ''}
                        </div>
                        <div class="item-actions">
                            <button class="btn-sm" onclick="viewPost('${post.id}')">👁️ View</button>
                            ${isHidden ? 
                                `<button class="btn-sm success" onclick="toggleHidePost('${post.id}', true)">👁️ Unhide</button>` :
                                `<button class="btn-sm" onclick="toggleHidePost('${post.id}', false)">🔒 Hide</button>`
                            }
                            <button class="btn-sm" onclick="openEditModal('${post.id}')">✏️ Edit</button>
                            <button class="btn-sm danger" onclick="deletePost('${post.id}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateBulkActions();
        }

        // ===== BULK ACTIONS =====
        function updateBulkActions() {
            const container = document.getElementById('bulkActions');
            const count = selectedPosts.size;
            if (count > 0) {
                container.classList.add('visible');
                document.getElementById('bulkCount').textContent = count;
            } else {
                container.classList.remove('visible');
            }
        }

        window.toggleSelectPost = function(postId) {
            if (selectedPosts.has(postId)) {
                selectedPosts.delete(postId);
            } else {
                selectedPosts.add(postId);
            }
            renderPosts();
        };

        window.selectAllPosts = function() {
            const visiblePosts = document.querySelectorAll('.list-item');
            const allSelected = visiblePosts.length > 0 && 
                visiblePosts.every(el => selectedPosts.has(el.id.replace('post-', '')));
            
            if (allSelected) {
                selectedPosts.clear();
            } else {
                visiblePosts.forEach(el => {
                    const id = el.id.replace('post-', '');
                    selectedPosts.add(id);
                });
            }
            renderPosts();
        };

        window.clearSelection = function() {
            selectedPosts.clear();
            renderPosts();
        };

        window.bulkHidePosts = async function() {
            const count = selectedPosts.size;
            const confirmed = await showConfirmModal({
                type: 'warning',
                icon: '🔒',
                title: 'Hide Selected Posts',
                message: `Are you sure you want to hide ${count} post(s)? They will be hidden from public view.`,
                confirmText: 'Hide All',
                confirmType: 'danger'
            });
            if (!confirmed) return;

            try {
                const batch = writeBatch(db);
                for (const postId of selectedPosts) {
                    const postRef = doc(db, "posts", postId);
                    batch.update(postRef, { hidden: true });
                }
                await batch.commit();
                showToast(`${count} post(s) hidden successfully!`, 'success');
                selectedPosts.clear();
                renderPosts();
            } catch (error) {
                console.error("Error hiding posts:", error);
                showToast("Failed to hide posts", "error");
            }
        };

        window.bulkUnhidePosts = async function() {
            const count = selectedPosts.size;
            const confirmed = await showConfirmModal({
                type: 'warning',
                icon: '👁️',
                title: 'Unhide Selected Posts',
                message: `Are you sure you want to unhide ${count} post(s)? They will be visible to everyone.`,
                confirmText: 'Unhide All',
                confirmType: 'primary'
            });
            if (!confirmed) return;

            try {
                const batch = writeBatch(db);
                for (const postId of selectedPosts) {
                    const postRef = doc(db, "posts", postId);
                    batch.update(postRef, { hidden: false });
                }
                await batch.commit();
                showToast(`${count} post(s) unhidden successfully!`, 'success');
                selectedPosts.clear();
                renderPosts();
            } catch (error) {
                console.error("Error unhiding posts:", error);
                showToast("Failed to unhide posts", "error");
            }
        };

        window.bulkDeletePosts = async function() {
            const count = selectedPosts.size;
            const confirmed = await showConfirmModal({
                type: 'danger',
                icon: '🗑️',
                title: 'Delete Selected Posts',
                message: `Are you sure you want to permanently delete ${count} post(s)? This action cannot be undone.`,
                details: `This will remove ${count} post(s) from the database permanently.`,
                confirmText: 'Delete All',
                confirmType: 'danger'
            });
            if (!confirmed) return;

            try {
                const batch = writeBatch(db);
                for (const postId of selectedPosts) {
                    const postRef = doc(db, "posts", postId);
                    batch.delete(postRef);
                }
                await batch.commit();
                showToast(`${count} post(s) deleted successfully!`, 'success');
                selectedPosts.clear();
                renderPosts();
            } catch (error) {
                console.error("Error deleting posts:", error);
                showToast("Failed to delete posts", "error");
            }
        };

        // ===== POST ACTIONS =====
        window.toggleHidePost = async function(postId, currentlyHidden) {
            const confirmed = await showConfirmModal({
                type: 'warning',
                icon: currentlyHidden ? '👁️' : '🔒',
                title: currentlyHidden ? 'Unhide Post' : 'Hide Post',
                message: currentlyHidden ? 'Make this post visible to everyone again?' : 'Hide this post from public view?',
                confirmText: currentlyHidden ? 'Unhide' : 'Hide',
                confirmType: currentlyHidden ? 'primary' : 'danger'
            });
            if (!confirmed) return;

            try {
                await updateDoc(doc(db, "posts", postId), { hidden: !currentlyHidden });
                showToast(currentlyHidden ? 'Post unhidden!' : 'Post hidden!', 'success');
                const post = allPosts.find(p => p.id === postId);
                if (post) post.hidden = !currentlyHidden;
                renderPosts();
            } catch (error) {
                console.error("Error toggling post:", error);
                showToast("Failed to update post", "error");
            }
        };

        window.deletePost = async function(postId) {
            const confirmed = await showConfirmModal({
                type: 'danger',
                icon: '🗑️',
                title: 'Delete Post',
                message: 'This action cannot be undone. The post will be permanently deleted.',
                confirmText: 'Delete',
                confirmType: 'danger'
            });
            if (!confirmed) return;

            try {
                await deleteDoc(doc(db, "posts", postId));
                showToast('Post deleted successfully!', 'success');
                allPosts = allPosts.filter(p => p.id !== postId);
                renderPosts();
            } catch (error) {
                console.error("Error deleting post:", error);
                showToast("Failed to delete post", "error");
            }
        };

        window.viewPost = function(postId) {
            window.location.href = `feed.html?post=${postId}`;
        };

        // ===== EDIT POST =====
        window.openEditModal = function(postId) {
            currentEditPostId = postId;
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            document.getElementById('editPostContent').value = post.content || '';
            document.getElementById('editPostId').value = postId;
            
            // Show preview of current content
            const preview = document.getElementById('editPostPreview');
            preview.textContent = post.content || 'No content';
            
            document.getElementById('editModal').classList.add('active');
        };

        window.closeEditModal = function() {
            currentEditPostId = null;
            document.getElementById('editModal').classList.remove('active');
        };

        window.saveEditPost = async function() {
            const postId = document.getElementById('editPostId').value;
            const content = document.getElementById('editPostContent').value.trim();
            
            if (!content) {
                showToast("Post content cannot be empty", "error", "Edit Failed");
                return;
            }

            try {
                await updateDoc(doc(db, "posts", postId), { content: content });
                showToast("Post updated successfully!", "success", "Post Updated");
                closeEditModal();
                const post = allPosts.find(p => p.id === postId);
                if (post) post.content = content;
                renderPosts();
            } catch (error) {
                console.error("Error updating post:", error);
                showToast("Failed to update post", "error", "Edit Failed");
            }
        };

        // ===== LIVE LISTENER =====
        function initListener() {
            if (unsubscribePosts) unsubscribePosts();
            const postsQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            unsubscribePosts = onSnapshot(postsQuery, (snapshot) => {
                allPosts = [];
                snapshot.forEach(doc => {
                    allPosts.push({ id: doc.id, ...doc.data() });
                });
                renderPosts();
            }, (error) => {
                console.error("Posts listener error:", error);
                document.getElementById('postsList').innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        <p>Error loading posts. Please refresh.</p>
                    </div>
                `;
            });
        }

        // ===== INIT =====
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUser = user;

            const isAdmin = user.email && user.email.toLowerCase() === PRIMARY_ADMIN.toLowerCase();
            if (!isAdmin) {
                window.location.href = "feed.html";
                return;
            }

            try {
                const saved = localStorage.getItem('spikeSettings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    document.documentElement.style.setProperty('--primary', settings.accentColor || '#00a884');
                    document.documentElement.style.setProperty('--primary-glow', (settings.accentColor || '#00a884') + '40');
                    document.documentElement.style.setProperty('--primary-hover', settings.accentColor || '#00a884');
                    if (!settings.darkMode) {
                        document.body.classList.add('light-mode');
                    }
                }
            } catch (e) {}

            initListener();
        });

        // ===== EXPOSE GLOBALLY =====
        window.showToast = showToast;
        window.dismissToast = dismissToast;
        window.handleConfirm = handleConfirm;
        window.handleCancel = handleCancel;
        window.renderPosts = renderPosts;
        window.toggleSelectPost = toggleSelectPost;
        window.selectAllPosts = selectAllPosts;
        window.clearSelection = clearSelection;
        window.bulkHidePosts = bulkHidePosts;
        window.bulkUnhidePosts = bulkUnhidePosts;
        window.bulkDeletePosts = bulkDeletePosts;
        window.toggleHidePost = toggleHidePost;
        window.deletePost = deletePost;
        window.viewPost = viewPost;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.saveEditPost = saveEditPost;

        console.log('📝 Admin Posts Management loaded');
        console.log('👑 Primary Admin:', PRIMARY_ADMIN);
        console.log('📊 Total posts loaded:', allPosts.length);
    </script>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <div class="header-left">
            <button class="back-btn" onclick="goToAdminHub()">← Back</button>
            <a href="feed.html" class="logo">SPIKE</a>
            <span class="admin-badge">🔐 Admin</span>
        </div>
        <div class="header-right">
            <a href="profile.html" class="header-nav-link" title="Profile">👤</a>
            <button class="header-nav-link" onclick="signOutUser()" title="Sign Out">🚪</button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="admin-main">

        <div class="page-title">
            <h1>📝 Posts <span class="post-count" id="postCount">0 posts</span></h1>
        </div>

        <!-- ===== CONTROLS ===== -->
        <div class="admin-controls">
            <input type="text" class="admin-search" id="postsSearch" placeholder="🔍 Search by content or author..." oninput="renderPosts()">
            <select class="admin-filter" id="postsFilter" onchange="renderPosts()">
                <option value="all">All Posts</option>
                <option value="visible">✅ Visible</option>
                <option value="hidden">🔒 Hidden</option>
                <option value="reported">🚩 Reported</option>
            </select>
            <select class="admin-sort" id="postsSort" onchange="renderPosts()">
                <option value="newest">🕐 Newest First</option>
                <option value="oldest">🕐 Oldest First</option>
                <option value="mostLiked">❤️ Most Liked</option>
                <option value="mostCommented">💬 Most Commented</option>
            </select>
        </div>

        <!-- ===== BULK ACTIONS ===== -->
        <div class="bulk-actions" id="bulkActions">
            <span class="bulk-count"><strong id="bulkCount">0</strong> posts selected</span>
            <button class="btn-sm" onclick="selectAllPosts()">☑️ Select All</button>
            <button class="btn-sm" onclick="clearSelection()">✖️ Clear</button>
            <button class="btn-sm" onclick="bulkHidePosts()">🔒 Hide</button>
            <button class="btn-sm success" onclick="bulkUnhidePosts()">👁️ Unhide</button>
            <button class="btn-sm danger" onclick="bulkDeletePosts()">🗑️ Delete</button>
        </div>

        <!-- ===== POSTS LIST ===== -->
        <div class="list-container" id="postsList">
            <div class="empty-state">
                <span class="icon">📝</span>
                <p>Loading posts...</p>
            </div>
        </div>

    </main>

    <!-- ===== EDIT MODAL ===== -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">✏️ Edit Post</div>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="post-preview" id="editPostPreview"></div>
                <input type="hidden" id="editPostId">
                <textarea id="editPostContent" placeholder="Edit post content..."></textarea>
                <div class="modal-actions">
                    <button class="btn-confirm secondary" onclick="closeEditModal()">Cancel</button>
                    <button class="btn-confirm primary" onclick="saveEditPost()">💾 Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRMATION MODAL ===== -->
    <div id="confirmModalOverlay" class="confirm-modal-overlay">
        <div id="confirmModal" class="confirm-modal warning">
            <div class="confirm-modal-icon">
                <span class="icon" id="confirmModalIcon">⚠️</span>
            </div>
            <div class="confirm-modal-title" id="confirmModalTitle">Are you sure?</div>
            <div class="confirm-modal-message" id="confirmModalMessage">This action cannot be undone.</div>
            <div id="confirmModalDetails" class="confirm-modal-details" style="display: none;"></div>
            <div class="confirm-modal-actions">
                <button class="btn-confirm secondary" id="confirmModalCancel" onclick="handleCancel()">Cancel</button>
                <button class="btn-confirm danger" id="confirmModalConfirm" onclick="handleConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div class="toast-icon-wrapper">
                <span class="icon" id="toastIcon">✓</span>
            </div>
            <div class="toast-text-group">
                <div class="toast-title" id="toastTitle">Success</div>
                <div class="toast-message" id="toastMessage">Action completed successfully.</div>
            </div>
            <button class="toast-close-btn" onclick="dismissToast()">✕</button>
            <div class="toast-progress"></div>
        </div>
    </div>

    <footer class="feed-footer">
        <p>Made with <span class="footer-heart">❤️</span> by SPIKE Team &nbsp;|&nbsp; © 2026 SPIKE. All rights reserved.</p>
    </footer>

</body>
</html>
