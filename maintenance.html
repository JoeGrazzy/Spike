<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Maintenance · SPIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET - NO SHAKE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #070b10;
            --bg-glass: rgba(13, 21, 32, 0.92);
            --border-color: rgba(255, 255, 255, 0.06);
            --primary: #00a884;
            --primary-hover: #00d4a0;
            --primary-glow: rgba(0, 168, 132, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --gold: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.2);
        }

        body.light-mode {
            --bg-deep: #f0f4fa;
            --bg-glass: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.06);
            --text-main: #0f1824;
            --text-muted: #5a6e8a;
        }

        /* ===== FIXED FULLSCREEN - NO SCROLL, NO SHAKE ===== */
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
            touch-action: none;
        }

        /* ===== AMBIENT GLOW - FIXED ===== */
        body::before,
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.08;
            pointer-events: none;
            will-change: transform;
        }
        body::before {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }
        body::after {
            bottom: -100px;
            right: -100px;
            background: #0ea5e9;
        }

        /* ===== MAIN CONTAINER - STABLE ===== */
        .maintenance-container {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: clamp(28px, 5vw, 44px) clamp(20px, 4vw, 36px);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(0,168,132,0.03);
            will-change: transform, opacity;
            transform: translateZ(0);
            backface-visibility: hidden;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 98vh;
            overflow-y: auto;
        }

        .maintenance-container::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.97); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== LOGO ===== */
        .logo {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 2px;
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            background: rgba(0, 168, 132, 0.08);
            border: 1px solid rgba(0, 168, 132, 0.15);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
        }

        /* ===== ICON ===== */
        .icon {
            font-size: clamp(3.2rem, 12vw, 4.5rem);
            display: block;
            margin-bottom: 8px;
            line-height: 1;
            filter: drop-shadow(0 8px 24px rgba(0, 168, 132, 0.15));
            animation: float 4s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* ===== TEXT ===== */
        h1 {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--text-main);
            line-height: 1.2;
        }

        p {
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* ===== TIMER - STABLE ===== */
        .timer {
            display: flex;
            justify-content: center;
            gap: clamp(10px, 2vw, 18px);
            margin: 16px 0 22px 0;
        }

        .timer-block {
            background: rgba(7, 11, 16, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 6px;
            min-width: 56px;
            flex: 1;
            max-width: 76px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s ease;
        }

        .timer-block:hover {
            border-color: rgba(0, 168, 132, 0.2);
        }

        .timer-number {
            font-size: clamp(1.4rem, 4.5vw, 2rem);
            font-weight: 800;
            color: var(--text-main);
            display: block;
            line-height: 1.1;
        }

        .timer-label {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 2px;
            display: block;
        }

        /* ===== UPGRADED PREMIUM BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            border-radius: 60px;
            padding: 16px 28px;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            min-height: 54px;
            min-width: 140px;
            flex: 1;
            max-width: 220px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            position: relative;
            overflow: hidden;
        }

        /* Primary Button - Premium Glow */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #00d4a0);
            color: white;
            box-shadow: 0 0 40px var(--primary-glow), 0 4px 20px rgba(0,168,132,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00d4a0, #00e8b0);
            box-shadow: 0 0 60px var(--primary-glow), 0 8px 30px rgba(0,168,132,0.4);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: scale(0.94) translateY(0);
            transition-duration: 0.05s;
        }

        /* Outline Button - Premium Glass */
        .btn-outline {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-outline::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .btn-outline:active {
            transform: scale(0.94) translateY(0);
            transition-duration: 0.05s;
        }

        /* Logout Button - Premium Gold */
        .btn-logout {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(255, 215, 0, 0.02));
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: var(--gold);
            box-shadow: 0 0 30px var(--gold-glow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn-logout::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 50px var(--gold-glow), 0 8px 30px rgba(255,215,0,0.1);
            transform: translateY(-2px);
            color: #ffe44d;
        }

        .btn-logout:active {
            transform: scale(0.94) translateY(0);
            transition-duration: 0.05s;
        }

        .btn .icon-left {
            font-size: 1.1rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
        }

        .btn-primary .icon-left {
            filter: drop-shadow(0 0 8px rgba(0,168,132,0.3));
        }

        .btn-logout .icon-left {
            filter: drop-shadow(0 0 8px rgba(255,215,0,0.2));
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 20px;
            font-size: 0.65rem;
            color: var(--text-muted);
            opacity: 0.4;
            letter-spacing: 0.02em;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .footer a:hover {
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .maintenance-container {
                padding: 24px 16px;
                border-radius: 24px;
            }
            .timer-block {
                min-width: 48px;
                max-width: 64px;
                padding: 8px 4px;
            }
            .timer-number {
                font-size: 1.3rem;
            }
            .btn {
                min-width: 100px;
                padding: 14px 18px;
                font-size: 0.82rem;
                min-height: 48px;
            }
            .btn-group {
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .timer {
                gap: 6px;
            }
            .timer-block {
                min-width: 40px;
                max-width: 56px;
                padding: 6px 2px;
            }
            .timer-number {
                font-size: 1.1rem;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                max-width: 100%;
                width: 100%;
                min-width: unset;
                padding: 14px 16px;
            }
            .maintenance-container {
                padding: 20px 14px;
                border-radius: 20px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .maintenance-container {
                padding: 16px 20px;
                border-radius: 20px;
                max-height: 92vh;
            }
            .icon {
                font-size: 2.2rem;
                margin-bottom: 4px;
            }
            h1 {
                font-size: 1.2rem;
                margin-bottom: 2px;
            }
            p {
                font-size: 0.75rem;
                margin-bottom: 10px;
            }
            .timer {
                margin: 8px 0 12px 0;
                gap: 8px;
            }
            .timer-block {
                padding: 4px 4px;
                min-width: 40px;
                max-width: 56px;
            }
            .timer-number {
                font-size: 1.1rem;
            }
            .btn {
                min-height: 38px;
                padding: 8px 14px;
                font-size: 0.72rem;
                min-width: 80px;
            }
            .footer {
                margin-top: 10px;
                font-size: 0.55rem;
            }
        }

        /* ===== PREVENT ANY CONTENT SHIFT ===== */
        .maintenance-container * {
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            transform: translateZ(0);
        }
    </style>
</head>
<body>

    <!-- MAINTENANCE CONTAINER -->
    <div class="maintenance-container">

        <span class="status-badge" id="statusBadge">🔧 Under Maintenance</span>

        <span class="icon">🛠️</span>

        <div class="logo">SPIKE</div>
        <h1>We'll Be Right Back</h1>

        <p id="descriptionText">
            We're applying fresh updates to make your experience smoother.<br>
            The feed will be back online shortly.
        </p>

        <!-- TIMER -->
        <div class="timer" id="timerContainer">
            <div class="timer-block">
                <span class="timer-number" id="hours">02</span>
                <span class="timer-label">Hours</span>
            </div>
            <div class="timer-block">
                <span class="timer-number" id="minutes">18</span>
                <span class="timer-label">Minutes</span>
            </div>
            <div class="timer-block">
                <span class="timer-number" id="seconds">46</span>
                <span class="timer-label">Seconds</span>
            </div>
        </div>

        <!-- BUTTONS - UPGRADED PREMIUM -->
        <div class="btn-group">
            <a href="mailto:eletexjoeytex@gmail.com?subject=SPIKE%20Maintenance%20Inquiry" class="btn btn-primary">
                <span class="icon-left">✉️</span> Contact Admin
            </a>
            <button class="btn btn-outline" onclick="location.reload()">
                <span class="icon-left">🔄</span> Refresh
            </button>
        </div>

        <!-- LOGOUT BUTTON - TAKES USER TO index.html -->
        <div class="btn-group" style="margin-top: 8px;">
            <a href="index.html" class="btn btn-logout">
                <span class="icon-left">🚪</span> Sign Out
            </a>
        </div>

        <div class="footer">
            <span id="version">v2.4.1</span> &middot; <a href="#" onclick="return false;">SPIKE Ultra</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== COUNTDOWN TIMER - FETCH FROM LOCALSTORAGE =====
            let totalSeconds = 7200; // Default: 2 hours
            let timerInterval = null;

            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const statusBadge = document.getElementById('statusBadge');
            const descriptionText = document.getElementById('descriptionText');

            // ===== LOAD MAINTENANCE DATA =====
            function loadMaintenanceData() {
                try {
                    const data = localStorage.getItem('spikeMaintenance');
                    if (data) {
                        const parsed = JSON.parse(data);
                        
                        // Update ETA if available
                        if (parsed.eta && parsed.eta > 0) {
                            totalSeconds = parsed.eta;
                        }
                        
                        // Update status badge
                        if (parsed.status) {
                            statusBadge.textContent = '🔧 ' + parsed.status;
                        }
                        
                        // Update description
                        if (parsed.description) {
                            descriptionText.textContent = parsed.description;
                        }
                        
                        console.log('✅ Maintenance data loaded:', parsed);
                    }
                } catch (e) {
                    console.error('Error loading maintenance data:', e);
                }
                
                // Start timer with loaded ETA
                updateTimer();
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, 1000);
            }

            // ===== UPDATE TIMER DISPLAY =====
            function updateTimer() {
                if (totalSeconds <= 0) {
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    return;
                }
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = Math.floor(totalSeconds % 60);
                hoursEl.textContent = String(h).padStart(2, '0');
                minutesEl.textContent = String(m).padStart(2, '0');
                secondsEl.textContent = String(s).padStart(2, '0');
                totalSeconds -= 1;
            }

            // ===== LISTEN FOR FIREBASE UPDATES =====
            function listenForFirebaseUpdates() {
                // Check if Firebase is available
                if (typeof firebase !== 'undefined' && firebase.firestore) {
                    try {
                        const db = firebase.firestore();
                        db.collection('settings').doc('maintenance').onSnapshot((doc) => {
                            if (doc.exists) {
                                const data = doc.data();
                                // Update localStorage
                                localStorage.setItem('spikeMaintenance', JSON.stringify(data));
                                
                                // Update ETA if changed
                                if (data.eta && data.eta > 0 && data.eta !== totalSeconds) {
                                    totalSeconds = data.eta;
                                    // Reset timer display
                                    updateTimer();
                                }
                                
                                // Update status badge
                                if (data.status) {
                                    statusBadge.textContent = '🔧 ' + data.status;
                                }
                                
                                // Update description
                                if (data.description) {
                                    descriptionText.textContent = data.description;
                                }
                                
                                // If maintenance is OFF, redirect to feed
                                if (data.active === false) {
                                    console.log('✅ Maintenance toggled OFF - Redirecting to feed');
                                    window.location.href = 'feed.html';
                                }
                                
                                console.log('🔄 Maintenance updated from Firebase:', data);
                            }
                        }, (error) => {
                            console.error('Firebase listener error:', error);
                        });
                    } catch (e) {
                        console.log('Firebase not available, using localStorage only');
                    }
                } else {
                    console.log('Firebase not loaded, using localStorage only');
                }
            }

            // ===== CHECK MAINTENANCE STATUS - REDIRECT IF OFF =====
            function checkMaintenanceStatus() {
                try {
                    const data = localStorage.getItem('spikeMaintenance');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.active === false) {
                            console.log('✅ Maintenance is OFF - Redirecting to feed');
                            window.location.href = 'feed.html';
                            return true;
                        }
                    }
                } catch (e) {
                    console.error('Error checking maintenance status:', e);
                }
                return false;
            }

            // ===== STORAGE LISTENER (Cross-tab sync) =====
            window.addEventListener('storage', function(e) {
                if (e.key === 'spikeMaintenance') {
                    try {
                        const data = JSON.parse(e.newValue);
                        if (data) {
                            if (data.eta && data.eta > 0) {
                                totalSeconds = data.eta;
                                updateTimer();
                            }
                            if (data.status) {
                                statusBadge.textContent = '🔧 ' + data.status;
                            }
                            if (data.description) {
                                descriptionText.textContent = data.description;
                            }
                            if (data.active === false) {
                                window.location.href = 'feed.html';
                            }
                        }
                    } catch (e) {
                        console.error('Storage event error:', e);
                    }
                }
            });

            // ===== PREVENT SCROLL / SHAKE =====
            document.body.addEventListener('touchmove', function(e) {
                if (e.target.closest('.maintenance-container')) {
                    const container = e.target.closest('.maintenance-container');
                    if (container.scrollHeight <= container.clientHeight) {
                        e.preventDefault();
                    }
                    return;
                }
                e.preventDefault();
            }, { passive: false });

            // ===== INIT =====
            function init() {
                // Check if maintenance is active
                const isActive = checkMaintenanceStatus();
                if (isActive) return;
                
                // Load maintenance data
                loadMaintenanceData();
                
                // Listen for Firebase updates
                listenForFirebaseUpdates();
                
                console.log('🔧 SPIKE Maintenance - ETA Integration Active');
                console.log('⏱️ Initial ETA:', totalSeconds, 'seconds');
            }

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // ===== CLEANUP =====
            window.addEventListener('beforeunload', function() {
                if (timerInterval) clearInterval(timerInterval);
            });

        })();
    </script>
</body>
</html>
