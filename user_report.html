<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reports Management — SPIKE</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Premium Glassmorphic Dark Design System matched across SPIKE */
        :root {
            --bg-deep: #070b10;
            --bg-surface: #0d1520;
            --bg-card: rgba(20, 32, 48, 0.7);
            --bg-glass: rgba(13, 21, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 168, 132, 0.3);
            
            --primary: #00a884;
            --primary-hover: #00c29a;
            --primary-glow: rgba(0, 168, 132, 0.4);
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --error: #f43f5e;
            --success: #00a884;
            
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            min-height: 100dvh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(244, 63, 94, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 168, 132, 0.05) 0%, transparent 40%);
        }

        /* Glassmorphism Header */
        .reports-header {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-decoration: none;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: var(--transition);
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .nav-avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Main Container */
        .reports-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            width: 100%;
            max-width: 600px;
            margin: auto;
            gap: 16px;
        }

        .reports-title-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .page-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reports-count-badge {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--error);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Reports Stream Container */
        .reports-stream {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .report-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition);
        }

        .report-card:hover {
            border-color: rgba(244, 63, 94, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 15px rgba(244, 63, 94, 0.1);
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reporter-meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .reporter-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .report-time {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .report-status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .report-status-badge.pending {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }

        .report-status-badge.resolved {
            background: rgba(0, 168, 132, 0.15);
            border: 1px solid rgba(0, 168, 132, 0.3);
            color: var(--success);
        }

        .report-body {
            background: rgba(7, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .report-target-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .report-target-author {
            color: var(--text-main);
            font-weight: 600;
        }

        .report-reason-text {
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.45;
            word-break: break-word;
        }

        .report-actions-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding-top: 4px;
        }

        .btn-action {
            padding: 7px 14px;
            border-radius: 10px;
            font-family: var(--font-main);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action.resolve {
            background: rgba(0, 168, 132, 0.1);
            color: var(--success);
            border-color: rgba(0, 168, 132, 0.3);
        }
        .btn-action.resolve:hover {
            background: rgba(0, 168, 132, 0.2);
        }

        .btn-action.delete-post {
            background: rgba(244, 63, 94, 0.1);
            color: var(--error);
            border-color: rgba(244, 63, 94, 0.3);
        }
        .btn-action.delete-post:hover {
            background: rgba(244, 63, 94, 0.2);
        }

        /* Toast Notification Component */
        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 3000;
            width: calc(100% - 32px);
            max-width: 400px;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            pointer-events: none;
        }

        .toast-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-content {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .toast-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        .toast-container.success .toast-icon {
            background: rgba(0, 168, 132, 0.2);
            color: var(--success);
            border: 1px solid rgba(0, 168, 132, 0.4);
            box-shadow: 0 0 10px rgba(0, 168, 132, 0.3);
        }

        .toast-container.error .toast-icon {
            background: rgba(244, 63, 94, 0.2);
            color: var(--error);
            border: 1px solid rgba(244, 63, 94, 0.4);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        .toast-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            flex: 1;
            line-height: 1.3;
        }

        /* Footer */
        .reports-footer {
            width: 100%;
            max-width: 600px;
            padding: 14px 16px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>

    <!-- Firebase SDK Setup & Real-time Firestore Reports Synchronization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let unsubscribeReports = null;

        // Authorized Admin Emails
        const ADMIN_EMAILS = [
            "eletexjoeytex@gmail.com",
            "elechihappiness309@gmail.com"
        ];

        let toastTimeout;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = `toast-container ${type} active`;
            toastText.textContent = message;
            toastIcon.textContent = type === 'success' ? '✓' : '✕';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            const now = Date.now();
            const postTime = timestamp.toMillis ? timestamp.toMillis() : new Date(timestamp).getTime();
            const elapsedSeconds = Math.floor((now - postTime) / 1000);

            if (elapsedSeconds < 5) return 'Just now';
            if (elapsedSeconds < 60) return `${elapsedSeconds}s ago`;
            const minutes = Math.floor(elapsedSeconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d ago`;
            
            const dateObj = new Date(postTime);
            return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        async function updateHeaderProfileAvatar(user) {
            const profileNavLink = document.getElementById("profileNavLink");
            if (!profileNavLink) return;

            let avatarUrl = localStorage.getItem("userAvatar");
            if (avatarUrl) {
                profileNavLink.innerHTML = `<img src="${avatarUrl}" alt="Profile" class="nav-avatar-img">`;
            }

            try {
                const userDocSnap = await getDoc(doc(db, "users", user.uid));
                if (userDocSnap.exists() && userDocSnap.data().photoURL) {
                    const freshAvatarUrl = userDocSnap.data().photoURL;
                    if (freshAvatarUrl !== avatarUrl) {
                        localStorage.setItem("userAvatar", freshAvatarUrl);
                        profileNavLink.innerHTML = `<img src="${freshAvatarUrl}" alt="Profile" class="nav-avatar-img">`;
                    }
                }
            } catch (err) {
                console.error("Error fetching user profile avatar:", err);
            }
        }

        function initRealtimeReports() {
            const reportsStream = document.getElementById("reportsStream");
            const reportsCountBadge = document.getElementById("reportsCountBadge");

            if (unsubscribeReports) {
                unsubscribeReports();
            }

            unsubscribeReports = onSnapshot(collection(db, "reports"), (querySnapshot) => {
                let reportsArray = [];
                querySnapshot.forEach((docSnap) => {
                    reportsArray.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Sort descending newest first
                reportsArray.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                const pendingCount = reportsArray.filter(r => r.status === "pending" || !r.status).length;
                reportsCountBadge.textContent = `${pendingCount} Pending`;

                if (reportsArray.length === 0) {
                    reportsStream.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 40px 0;">No post reports submitted yet.</div>`;
                    return;
                }

                let reportsHTML = "";
                reportsArray.forEach((report) => {
                    const reportId = report.id;
                    const reporterName = report.reporterName || 'User';
                    const postAuthor = report.postAuthor || 'Author';
                    const reason = report.reason || 'No reason provided';
                    const timeAgo = formatTimeAgo(report.createdAt);
                    const status = report.status || 'pending';
                    const isResolved = status === 'resolved';

                    reportsHTML += `
                        <div class="report-card" id="report-card-${reportId}">
                            <div class="report-header">
                                <div class="reporter-meta">
                                    <span class="reporter-name">Reported by ${escapeHTML(reporterName)}</span>
                                    <span class="report-time">${timeAgo}</span>
                                </div>
                                <span class="report-status-badge ${isResolved ? 'resolved' : 'pending'}">${status}</span>
                            </div>
                            <div class="report-body">
                                <div class="report-target-info">
                                    <span>Target Post Author:</span>
                                    <span class="report-target-author">${escapeHTML(postAuthor)}</span>
                                </div>
                                <div class="report-reason-text">"${escapeHTML(reason)}"</div>
                            </div>
                            <div class="report-actions-row">
                                ${!isResolved ? `<button class="btn-action resolve" onclick="resolveReport('${reportId}')">✓ Mark Resolved</button>` : ''}
                                ${report.postId ? `<button class="btn-action delete-post" onclick="deleteReportedPost('${reportId}', '${report.postId}')">🗑️ Delete Post</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                reportsStream.innerHTML = reportsHTML;

            }, (error) => {
                console.error("Realtime reports sync error:", error);
                showToast("Failed to load reports", "error");
            });
        }

        window.resolveReport = async function(reportId) {
            try {
                await updateDoc(doc(db, "reports", reportId), {
                    status: "resolved"
                });
                showToast("Report marked as resolved", "success");
            } catch (err) {
                console.error("Error resolving report:", err);
                showToast("Failed to update report", "error");
            }
        };

        window.deleteReportedPost = async function(reportId, postId) {
            try {
                // Delete the offending post
                await deleteDoc(doc(db, "posts", postId));
                // Mark the report as resolved/deleted
                await updateDoc(doc(db, "reports", reportId), {
                    status: "resolved"
                });
                showToast("Reported post deleted successfully", "success");
            } catch (err) {
                console.error("Error deleting reported post:", err);
                showToast("Failed to delete post", "error");
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.href = "login.html";
                } else {
                    currentUser = user;
                    updateHeaderProfileAvatar(user);
                    initRealtimeReports();
                }
            });
        });
    </script>
</head>
<body>

    <header class="reports-header">
        <a href="feed.html" class="logo">SPIKE</a>
        <div class="user-nav">
            <a href="feed.html" class="nav-link" title="Back to Feed">🏠</a>
            <a href="profile.html" class="nav-link" id="profileNavLink" title="Profile">👤</a>
        </div>
    </header>

    <main class="reports-main">
        <div class="reports-title-bar">
            <div class="page-title">
                <span>🚩 Post Reports</span>
            </div>
            <div class="reports-count-badge" id="reportsCountBadge">0 Pending</div>
        </div>

        <div class="reports-stream" id="reportsStream">
            <!-- Dynamic Reports Stream -->
        </div>
    </main>

    <!-- Global Toast Notification Component -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div id="toastIcon" class="toast-icon">✓</div>
            <div id="toastText" class="toast-text">Action completed successfully.</div>
        </div>
    </div>

    <footer class="reports-footer">
        <p>&copy; 2026 SPIKE. All rights reserved.</p>
    </footer>

</body>
</html>
