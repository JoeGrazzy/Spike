<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Call — SPIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #090A0F;
            --bg-surface: #121520;
            --bg-card: rgba(25, 30, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --accent: #EC4899;
            --error: #EF4444;
            --success: #10B981;
            --warning: #EAB308;
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 100dvh;
        }

        /* Full Screen Video Container */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video#remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #1a1d29;
        }

        /* Small Local Floating Video Overlay */
        .local-video-wrapper {
            position: absolute;
            top: 80px;
            right: 16px;
            width: 120px;
            height: 170px;
            border-radius: 16px;
            overflow: hidden;
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            background: #1a1d29;
            transition: var(--transition);
            cursor: pointer;
        }

        .local-video-wrapper:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .local-video-wrapper.dragging {
            opacity: 0.8;
            transform: scale(0.95);
        }

        video#localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror local feed */
        }

        /* Connection Quality Indicator */
        .connection-quality-overlay {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
        }

        .connection-quality-overlay.visible {
            opacity: 1;
        }

        .quality-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .quality-dot.good { background: var(--success); }
        .quality-dot.poor { background: var(--warning); }
        .quality-dot.bad { background: var(--error); }

        /* UI Overlay Layer */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
        }

        .ui-layer * {
            pointer-events: auto;
        }

        /* Header Bar */
        .call-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
        }

        .back-btn {
            background: rgba(18, 21, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .call-status-badge {
            background: rgba(18, 21, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .call-status-badge.connecting {
            color: var(--warning);
        }

        .call-status-badge.error {
            color: var(--error);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 8px currentColor; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Encryption Badge */
        .encryption-badge {
            background: rgba(18, 21, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.65rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Call Info / Placeholder Avatar overlay when video off */
        .caller-placeholder-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 5;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            transition: var(--transition);
        }

        .caller-placeholder-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .caller-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .caller-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .caller-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .call-timer {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* Bottom Action Bar */
        .call-controls {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding-bottom: 20px;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(18, 21, 32, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn.active {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .control-btn.end-call {
            background: var(--error);
            border-color: var(--error);
            color: white;
            width: 64px;
            height: 64px;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        .control-btn.end-call:hover {
            background: #dc2626;
        }

        .control-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--error);
            border: 2px solid var(--bg-deep);
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        /* Toast Component */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 400px;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            pointer-events: none;
        }

        .toast-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-content {
            background: rgba(18, 21, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .toast-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .toast-icon.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .toast-text {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            flex: 1;
            line-height: 1.3;
        }

        /* Permission Overlay */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .permission-overlay.active {
            display: flex;
        }

        .permission-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        .permission-card h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .permission-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .permission-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
        }

        .permission-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .permission-btn:active {
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .local-video-wrapper {
                width: 90px;
                height: 130px;
                top: 70px;
                right: 12px;
                border-radius: 12px;
            }

            .caller-name {
                font-size: 1.4rem;
            }

            .caller-avatar {
                width: 90px;
                height: 90px;
                font-size: 2rem;
            }

            .control-btn {
                width: 48px;
                height: 48px;
            }

            .control-btn.end-call {
                width: 56px;
                height: 56px;
            }

            .call-controls {
                gap: 12px;
            }

            .call-status-badge {
                font-size: 0.7rem;
                padding: 4px 10px;
            }

            .encryption-badge {
                font-size: 0.55rem;
                padding: 3px 8px;
            }
        }

        @media (max-width: 380px) {
            .local-video-wrapper {
                width: 75px;
                height: 110px;
                top: 60px;
                right: 8px;
            }

            .caller-name {
                font-size: 1.2rem;
            }

            .caller-avatar {
                width: 75px;
                height: 75px;
                font-size: 1.6rem;
            }

            .control-btn {
                width: 42px;
                height: 42px;
            }

            .control-btn.end-call {
                width: 48px;
                height: 48px;
            }

            .call-controls {
                gap: 10px;
            }
        }

        /* Landscape mode optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .local-video-wrapper {
                width: 80px;
                height: 110px;
                top: 60px;
                right: 12px;
            }

            .caller-name {
                font-size: 1.2rem;
            }

            .caller-avatar {
                width: 70px;
                height: 70px;
                font-size: 1.5rem;
            }

            .call-controls {
                padding-bottom: 10px;
            }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let localStream = null;
        let peerConnection = null;
        let callDocRef = null;
        let isCaller = false;
        let timerInterval = null;
        let currentFacingMode = "user";
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 3;
        let wakeLock = null;
        let qualityMonitorInterval = null;
        let isReconnecting = false;
        let isEndingCall = false;
        let remoteStream = null;

        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
                { urls: 'stun:stun.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10
        };

        let toastTimeout;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = 'toast-container active';
            toastText.textContent = message;
            
            toastIcon.className = 'toast-icon';
            if (type === 'error') {
                toastIcon.classList.add('error');
                toastIcon.textContent = '✕';
            } else if (type === 'success') {
                toastIcon.classList.add('success');
                toastIcon.textContent = '✓';
            } else {
                toastIcon.textContent = 'ℹ';
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        function setCallStatus(statusText, isConnecting = false, isError = false) {
            const badge = document.getElementById('statusBadge');
            const statusTextEl = document.getElementById('statusText');
            
            statusTextEl.textContent = statusText;
            badge.className = 'call-status-badge';
            
            if (isError) {
                badge.classList.add('error');
            } else if (isConnecting) {
                badge.classList.add('connecting');
            }
        }

        function updateQualityIndicator(quality) {
            const overlay = document.getElementById('qualityOverlay');
            const dot = document.getElementById('qualityDot');
            const text = document.getElementById('qualityText');
            
            overlay.classList.add('visible');
            
            if (quality === 'good') {
                dot.className = 'quality-dot good';
                text.textContent = 'Good';
            } else if (quality === 'poor') {
                dot.className = 'quality-dot poor';
                text.textContent = 'Fair';
            } else {
                dot.className = 'quality-dot bad';
                text.textContent = 'Poor';
            }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.warn('Wake lock not supported:', e);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function showPermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.add('active');
        }

        function hidePermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.remove('active');
        }

        async function requestMediaStream(facing = "user") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: facing,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true 
                    }
                });
                hidePermissionRequestUI();
                return stream;
            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showToast("Please allow camera and microphone access in your browser settings", 'error');
                    showPermissionRequestUI();
                } else if (err.name === 'NotFoundError') {
                    showToast("No camera or microphone found on this device", 'error');
                } else {
                    showToast("Media error: " + err.message, 'error');
                }
                throw err;
            }
        }

        function getInitials(name) {
            if (!name || name === "Calling...") return "??";
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        function displayContactInfo(name, photoUrl) {
            const nameEl = document.getElementById("callerName");
            const avatarEl = document.getElementById("callerAvatar");
            
            const displayName = (name && name.trim() !== "" && name !== "null") ? name : "Calling...";
            nameEl.textContent = displayName;
            
            if (photoUrl && photoUrl.trim() !== "" && photoUrl !== "null") {
                avatarEl.innerHTML = `<img src="${photoUrl}" alt="${displayName}" onerror="this.onerror=null; this.parentNode.innerHTML='${getInitials(displayName)}';">`;
            } else {
                avatarEl.textContent = getInitials(displayName);
            }
        }

        async function loadExactUserProfile(uid, paramName, paramPhoto) {
            let finalName = paramName || "";
            let finalPhoto = paramPhoto || "";

            if (uid) {
                try {
                    const userSnap = await getDoc(doc(db, 'users', uid));
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        finalName = data.name || data.displayName || data.username || finalName;
                        finalPhoto = data.photoURL || data.profilePicture || data.avatar || finalPhoto;
                    }
                } catch (err) {
                    console.error("Firestore lookup error:", err);
                }
            }

            if (!finalName || finalName === "null") finalName = "User";
            displayContactInfo(finalName, finalPhoto);
            return { name: finalName, photo: finalPhoto };
        }

        function startCallTimer() {
            if (timerInterval) return;
            let seconds = 0;
            const timerElement = document.getElementById("callTimer");
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopCallTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function monitorConnectionQuality() {
            if (!peerConnection) return;
            
            if (qualityMonitorInterval) {
                clearInterval(qualityMonitorInterval);
            }
            
            qualityMonitorInterval = setInterval(async () => {
                try {
                    if (!peerConnection || peerConnection.connectionState === 'closed' || peerConnection.connectionState === 'disconnected') {
                        return;
                    }
                    
                    const stats = await peerConnection.getStats();
                    let packetsLost = 0;
                    let totalPackets = 0;
                    let jitter = 0;
                    
                    stats.forEach(stat => {
                        if (stat.type === 'inbound-rtp' && stat.kind === 'video') {
                            packetsLost = stat.packetsLost || 0;
                            totalPackets = stat.packetsReceived + packetsLost;
                            jitter = stat.jitter || 0;
                        }
                    });
                    
                    if (totalPackets > 0) {
                        const lossRatio = packetsLost / totalPackets;
                        if (lossRatio < 0.01 && jitter < 20) {
                            updateQualityIndicator('good');
                        } else if (lossRatio < 0.05 && jitter < 50) {
                            updateQualityIndicator('poor');
                        } else {
                            updateQualityIndicator('bad');
                        }
                    }
                } catch (e) {
                    console.warn('Stats monitoring error:', e);
                }
            }, 5000);
        }

        async function cleanupAndExit(redirect = true) {
            if (isEndingCall) return;
            isEndingCall = true;
            
            stopCallTimer();
            
            if (qualityMonitorInterval) {
                clearInterval(qualityMonitorInterval);
                qualityMonitorInterval = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (peerConnection) {
                try {
                    peerConnection.close();
                } catch (e) {
                    console.warn('Peer connection close error:', e);
                }
                peerConnection = null;
            }
            
            releaseWakeLock();
            
            // Clean up video elements
            const remoteVideo = document.getElementById('remoteVideo');
            if (remoteVideo) {
                remoteVideo.srcObject = null;
                remoteVideo.poster = '';
            }
            
            const localVideo = document.getElementById('localVideo');
            if (localVideo) {
                localVideo.srcObject = null;
            }
            
            if (redirect) {
                showToast("Call ended", 'success');
                vibrate(100);
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            }
        }

        async function reconnectCall() {
            if (isReconnecting || isEndingCall) return;
            
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                showToast("Call ended due to connection issues", 'error');
                await cleanupAndExit();
                return;
            }
            
            isReconnecting = true;
            reconnectAttempts++;
            showToast(`Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'info');
            
            try {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                
                // Recreate peer connection
                peerConnection = new RTCPeerConnection(servers);
                
                // Re-add tracks
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }
                
                // Set up event handlers
                const offerCandidates = collection(callDocRef, 'offerCandidates');
                const answerCandidates = collection(callDocRef, 'answerCandidates');
                
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        const collection = isCaller ? offerCandidates : answerCandidates;
                        addDoc(collection, event.candidate.toJSON()).catch(e => console.warn('ICE candidate error:', e));
                    }
                };
                
                peerConnection.ontrack = (event) => {
                    remoteStream = event.streams[0];
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                    document.getElementById('callerOverlay').classList.add('hidden');
                    if (!timerInterval) {
                        startCallTimer();
                        setCallStatus("Connected");
                        vibrate([200, 100, 200]);
                    }
                    requestWakeLock();
                    monitorConnectionQuality();
                };
                
                peerConnection.onconnectionstatechange = () => {
                    if (peerConnection.connectionState === 'disconnected' || 
                        peerConnection.connectionState === 'failed') {
                        if (!isEndingCall && !isReconnecting) {
                            handleDisconnection();
                        }
                    }
                };
                
                // Re-establish connection based on role
                if (isCaller) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    await updateDoc(callDocRef, {
                        offer: { type: offer.type, sdp: offer.sdp }
                    });
                } else {
                    const callSnapshot = await getDoc(callDocRef);
                    const callData = callSnapshot.data();
                    if (callData && callData.offer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await updateDoc(callDocRef, {
                            answer: { type: answer.type, sdp: answer.sdp }
                        });
                    }
                }
                
                isReconnecting = false;
                setCallStatus("Reconnected");
                showToast("Call reconnected", 'success');
                
            } catch (err) {
                console.error('Reconnection failed:', err);
                isReconnecting = false;
                
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    setTimeout(() => reconnectCall(), 2000);
                } else {
                    showToast("Unable to reconnect call", 'error');
                    await cleanupAndExit();
                }
            }
        }

        function handleDisconnection() {
            if (isEndingCall || isReconnecting) return;
            
            setCallStatus("Connection lost", true, true);
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            setTimeout(() => {
                if (!isEndingCall) {
                    reconnectCall();
                }
            }, 2000);
        }

        async function terminateCall() {
            if (isEndingCall) return;
            
            try {
                if (callDocRef) {
                    await updateDoc(callDocRef, { 
                        ended: true,
                        endedAt: new Date().toISOString()
                    });
                }
            } catch (e) {
                console.warn('Failed to update call end status:', e);
            }
            
            await cleanupAndExit();
        }

        async function startCall(callerUid, calleeUid, calleeName, calleePhoto) {
            setCallStatus("Calling...", true);
            callDocRef = doc(collection(db, 'calls'));
            
            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('callerOverlay').classList.add('hidden');
                startCallTimer();
                setCallStatus("Connected");
                vibrate([200, 100, 200]);
                requestWakeLock();
                monitorConnectionQuality();
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'disconnected' || 
                    peerConnection.connectionState === 'failed') {
                    if (!isEndingCall) {
                        handleDisconnection();
                    }
                }
            };

            const offerCandidates = collection(callDocRef, 'offerCandidates');
            const answerCandidates = collection(callDocRef, 'answerCandidates');

            peerConnection.onicecandidate = (event) => {
                event.candidate && addDoc(offerCandidates, event.candidate.toJSON());
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            let callerName = "User";
            let callerPhoto = "";
            try {
                const myProfileSnap = await getDoc(doc(db, 'users', callerUid));
                if (myProfileSnap.exists()) {
                    const myData = myProfileSnap.data();
                    callerName = myData.name || myData.displayName || "User";
                    callerPhoto = myData.photoURL || myData.profilePicture || "";
                }
            } catch (e) {}

            const callData = {
                offer: { type: offer.type, sdp: offer.sdp },
                callerId: callerUid,
                callerName: callerName,
                callerPhoto: callerPhoto,
                calleeId: calleeUid || "",
                calleeName: calleeName || "",
                calleePhoto: calleePhoto || "",
                isVideo: true,
                createdAt: new Date().toISOString(),
                active: true
            };

            await setDoc(callDocRef, callData);

            const unsubscribe = onSnapshot(callDocRef, (snapshot) => {
                const data = snapshot.data();
                if (!data) return;
                
                if (!peerConnection.currentRemoteDescription && data.answer) {
                    const answer = new RTCSessionDescription(data.answer);
                    peerConnection.setRemoteDescription(answer);
                    setCallStatus("Connected");
                    startCallTimer();
                    vibrate([200, 100, 200]);
                    requestWakeLock();
                    monitorConnectionQuality();
                }
                
                if (data.ended) {
                    unsubscribe();
                    cleanupAndExit();
                }
            });

            const unsubscribeCandidates = onSnapshot(answerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added' && peerConnection) {
                        try {
                            const candidate = new RTCIceCandidate(change.doc.data());
                            peerConnection.addIceCandidate(candidate);
                        } catch (e) {
                            console.warn('ICE candidate add error:', e);
                        }
                    }
                });
            });
            
            window.__callUnsubscribes = [unsubscribe, unsubscribeCandidates];
        }

        async function joinCall(callId) {
            setCallStatus("Connecting...", true);
            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                remoteStream = event.streams[0];
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('callerOverlay').classList.add('hidden');
                startCallTimer();
                setCallStatus("Connected");
                vibrate([200, 100, 200]);
                requestWakeLock();
                monitorConnectionQuality();
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'disconnected' || 
                    peerConnection.connectionState === 'failed') {
                    if (!isEndingCall) {
                        handleDisconnection();
                    }
                }
            };

            const offerCandidates = collection(callDocRef, 'offerCandidates');
            const answerCandidates = collection(callDocRef, 'answerCandidates');

            peerConnection.onicecandidate = (event) => {
                event.candidate && addDoc(answerCandidates, event.candidate.toJSON());
            };

            const callSnapshot = await getDoc(callDocRef);
            const callData = callSnapshot.data();

            if (!callData || !callData.offer) {
                showToast("Call session not found or ended.", 'error');
                setTimeout(() => window.location.href = "index.html", 1500);
                return;
            }

            const offer = callData.offer;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await updateDoc(callDocRef, {
                answer: { type: answer.type, sdp: answer.sdp }
            });

            const unsubscribeCandidates = onSnapshot(offerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added' && peerConnection) {
                        try {
                            let data = change.doc.data();
                            peerConnection.addIceCandidate(new RTCIceCandidate(data));
                        } catch (e) {
                            console.warn('ICE candidate add error:', e);
                        }
                    }
                });
            });

            const unsubscribeCall = onSnapshot(callDocRef, (snapshot) => {
                const data = snapshot.data();
                if (data && data.ended) {
                    unsubscribeCall();
                    unsubscribeCandidates();
                    cleanupAndExit();
                }
            });
            
            window.__callUnsubscribes = [unsubscribeCall, unsubscribeCandidates];
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Permission retry button
            document.getElementById('retryPermissionBtn').addEventListener('click', async () => {
                try {
                    localStream = await requestMediaStream(currentFacingMode);
                    if (localStream) {
                        document.getElementById('localVideo').srcObject = localStream;
                        hidePermissionRequestUI();
                        initializeCall();
                    }
                } catch (e) {
                    console.error('Permission retry failed:', e);
                }
            });

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "login.html";
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const targetUserId = urlParams.get('userId') || urlParams.get('uid') || urlParams.get('calleeId') || urlParams.get('targetUserId');
                const rawName = urlParams.get('name');
                const rawPhoto = urlParams.get('photo') || urlParams.get('avatar') || urlParams.get('photoURL');
                const callId = urlParams.get('id');

                if (!callId && !targetUserId) {
                    showToast("Invalid call parameters", 'error');
                    setTimeout(() => window.location.href = "index.html", 1500);
                    return;
                }

                try {
                    localStream = await requestMediaStream(currentFacingMode);
                    document.getElementById('localVideo').srcObject = localStream;
                } catch (err) {
                    console.error("Camera/Mic permission error:", err);
                    return;
                }

                // Make local video draggable
                const localVideoWrapper = document.querySelector('.local-video-wrapper');
                let isDragging = false;
                let startX, startY, initialX, initialY;

                localVideoWrapper.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    const rect = localVideoWrapper.getBoundingClientRect();
                    initialX = rect.left;
                    initialY = rect.top;
                    isDragging = true;
                    localVideoWrapper.classList.add('dragging');
                }, { passive: true });

                document.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const touch = e.touches[0];
                    const dx = touch.clientX - startX;
                    const dy = touch.clientY - startY;
                    const newX = initialX + dx;
                    const newY = initialY + dy;
                    localVideoWrapper.style.left = newX + 'px';
                    localVideoWrapper.style.top = newY + 'px';
                    localVideoWrapper.style.right = 'auto';
                    localVideoWrapper.style.bottom = 'auto';
                }, { passive: true });

                document.addEventListener('touchend', () => {
                    isDragging = false;
                    localVideoWrapper.classList.remove('dragging');
                }, { passive: true });

                if (callId) {
                    isCaller = false;
                    callDocRef = doc(db, 'calls', callId);
                    
                    try {
                        const callSnap = await getDoc(callDocRef);
                        if (callSnap.exists()) {
                            const callData = callSnap.data();
                            const callerUid = callData.callerId || targetUserId;
                            await loadExactUserProfile(callerUid, callData.callerName || rawName, callData.callerPhoto || rawPhoto);
                        } else {
                            await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                        }
                    } catch (e) {
                        await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                    }

                    await joinCall(callId);
                } else {
                    isCaller = true;
                    const calleeProfile = await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                    await startCall(user.uid, targetUserId, calleeProfile.name, calleeProfile.photo);
                }
            });

            // Control Buttons
            const muteBtn = document.getElementById("muteBtn");
            const videoBtn = document.getElementById("videoBtn");
            const switchCamBtn = document.getElementById("switchCamBtn");
            const endCallBtn = document.getElementById("endCallBtn");

            let isMuted = false;
            let isVideoOff = false;

            muteBtn.addEventListener("click", () => {
                if (localStream) {
                    const audioTrack = localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        isMuted = !isMuted;
                        audioTrack.enabled = !isMuted;
                        muteBtn.classList.toggle("active", isMuted);
                        showToast(isMuted ? "Microphone muted" : "Microphone unmuted", 'info');
                        vibrate(50);
                    }
                }
            });

            videoBtn.addEventListener("click", () => {
                if (localStream) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        isVideoOff = !isVideoOff;
                        videoTrack.enabled = !isVideoOff;
                        videoBtn.classList.toggle("active", isVideoOff);
                        showToast(isVideoOff ? "Camera turned off" : "Camera turned on", 'info');
                        vibrate(50);
                    }
                }
            });

            switchCamBtn.addEventListener("click", async () => {
                if (!localStream) return;
                currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
                try {
                    const newStream = await requestMediaStream(currentFacingMode);
                    const videoTrack = newStream.getVideoTracks()[0];
                    const audioTrack = newStream.getAudioTracks()[0];
                    
                    // Replace tracks in local stream
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = newStream;
                    document.getElementById('localVideo').srcObject = localStream;
                    
                    if (peerConnection) {
                        const videoSender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                        const audioSender = peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        if (videoSender && videoTrack) videoSender.replaceTrack(videoTrack);
                        if (audioSender && audioTrack) audioSender.replaceTrack(audioTrack);
                    }
                    showToast("Camera switched", 'info');
                    vibrate(50);
                } catch (e) {
                    showToast("Could not switch camera", 'error');
                    console.error('Camera switch error:', e);
                }
            });

            endCallBtn.addEventListener("click", async () => {
                vibrate(100);
                await terminateCall();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'm' || e.key === 'M') {
                    muteBtn.click();
                    e.preventDefault();
                }
                if (e.key === 'v' || e.key === 'V') {
                    videoBtn.click();
                    e.preventDefault();
                }
                if (e.key === 'f' || e.key === 'F') {
                    switchCamBtn.click();
                    e.preventDefault();
                }
                if (e.key === 'Escape') {
                    endCallBtn.click();
                    e.preventDefault();
                }
            });

            // Handle page visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && wakeLock) {
                    // Keep wake lock
                } else if (!document.hidden && !wakeLock && peerConnection && peerConnection.connectionState === 'connected') {
                    requestWakeLock();
                }
            });

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (peerConnection && peerConnection.connectionState !== 'closed') {
                    try {
                        peerConnection.close();
                    } catch (e) {}
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                stopCallTimer();
                releaseWakeLock();
                if (window.__callUnsubscribes) {
                    window.__callUnsubscribes.forEach(unsub => {
                        try { unsub(); } catch (e) {}
                    });
                }
            });
        });

        // Helper function to initialize call after permission
        async function initializeCall() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetUserId = urlParams.get('userId') || urlParams.get('uid') || urlParams.get('calleeId') || urlParams.get('targetUserId');
            const rawName = urlParams.get('name');
            const rawPhoto = urlParams.get('photo') || urlParams.get('avatar') || urlParams.get('photoURL');
            const callId = urlParams.get('id');
            const user = auth.currentUser;
            
            if (!user) return;
            
            if (callId) {
                isCaller = false;
                callDocRef = doc(db, 'calls', callId);
                try {
                    const callSnap = await getDoc(callDocRef);
                    if (callSnap.exists()) {
                        const callData = callSnap.data();
                        const callerUid = callData.callerId || targetUserId;
                        await loadExactUserProfile(callerUid, callData.callerName || rawName, callData.callerPhoto || rawPhoto);
                    } else {
                        await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                    }
                } catch (e) {
                    await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                }
                await joinCall(callId);
            } else {
                isCaller = true;
                const calleeProfile = await loadExactUserProfile(targetUserId, rawName, rawPhoto);
                await startCall(user.uid, targetUserId, calleeProfile.name, calleeProfile.photo);
            }
        }
    </script>
</head>
<body>

    <!-- Video Canvas Base -->
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <!-- Connection Quality Indicator -->
    <div id="qualityOverlay" class="connection-quality-overlay">
        <span id="qualityDot" class="quality-dot good"></span>
        <span id="qualityText">Good</span>
    </div>

    <!-- Small Floating Self Video -->
    <div class="local-video-wrapper" id="localVideoWrapper">
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <!-- Permission Request Overlay -->
    <div id="permissionOverlay" class="permission-overlay">
        <div class="permission-card">
            <h2>📹 Camera & Mic Access</h2>
            <p>This video call requires camera and microphone access. Please grant permission to continue.</p>
            <button id="retryPermissionBtn" class="permission-btn">Allow Access</button>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <header class="call-header">
            <a href="index.html" class="back-btn" title="Back" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <div id="statusBadge" class="call-status-badge connecting">
                <span class="status-dot"></span>
                <span id="statusText">Initializing...</span>
            </div>
            <div class="encryption-badge">
                <span>🔒 Encrypted</span>
            </div>
        </header>

        <!-- Initial Placeholder Avatar -->
        <div id="callerOverlay" class="caller-placeholder-overlay">
            <div id="callerAvatar" class="caller-avatar"></div>
            <h1 id="callerName" class="caller-name">Calling...</h1>
            <p id="callTimer" class="call-timer">00:00</p>
        </div>

        <footer class="call-controls">
            <!-- Mute Audio -->
            <button id="muteBtn" class="control-btn" title="Mute Mic (M)" aria-label="Mute microphone">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>

            <!-- Toggle Video -->
            <button id="videoBtn" class="control-btn" title="Toggle Camera (V)" aria-label="Toggle camera">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>

            <!-- End Call -->
            <button id="endCallBtn" class="control-btn end-call" title="End Call (Esc)" aria-label="End call">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.33a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
            </button>

            <!-- Flip Camera -->
            <button id="switchCamBtn" class="control-btn" title="Flip Camera (F)" aria-label="Flip camera">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0-4.42-3.58-8-8-8s-8 3.58-8 8c0 3.12 1.78 5.83 4.4 7.15"/><polyline points="1 10 5 10 5 6"/><path d="M4 14c0 4.42 3.58 8 8 8s8-3.58 8-8c0-3.12-1.78-5.83-4.4-7.15"/><polyline points="23 14 19 14 19 18"/></svg>
            </button>
        </footer>
    </div>

    <!-- Toast Component -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div id="toastIcon" class="toast-icon">ℹ</div>
            <div id="toastText" class="toast-text"></div>
        </div>
    </div>

</body>
</html>
