    <!-- Firebase Real-time SDK Setup & WebRTC Voice Call Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let localStream = null;
        let peerConnection = null;
        let callDocRef = null;
        let isCaller = false;
        let timerInterval = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 3;
        let wakeLock = null;
        let qualityMonitorInterval = null;
        let isReconnecting = false;
        let isEndingCall = false;

        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
                { urls: 'stun:stun.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10
        };

        let toastTimeout;
        function showToast(message, type = 'info') {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = 'toast-container active';
            toastText.textContent = message;
            
            // Set icon based on type
            toastIcon.className = 'toast-icon';
            if (type === 'error') {
                toastIcon.classList.add('error');
                toastIcon.textContent = '✕';
            } else if (type === 'success') {
                toastIcon.classList.add('success');
                toastIcon.textContent = '✓';
            } else {
                toastIcon.textContent = 'ℹ';
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        function setCallStatus(statusText, isConnecting = false, isError = false) {
            const badge = document.getElementById('statusBadge');
            const statusTextEl = document.getElementById('statusText');
            
            statusTextEl.textContent = statusText;
            badge.className = 'call-status-badge';
            
            if (isError) {
                badge.classList.add('error');
            } else if (isConnecting) {
                badge.classList.add('connecting');
            }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {
                console.warn('Wake lock not supported:', e);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function showPermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.add('active');
        }

        function hidePermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.remove('active');
        }

        async function requestMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false 
                });
                hidePermissionRequestUI();
                return stream;
            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showToast("Please allow microphone access in your browser settings", 'error');
                    showPermissionRequestUI();
                } else if (err.name === 'NotFoundError') {
                    showToast("No microphone found on this device", 'error');
                } else {
                    showToast("Microphone error: " + err.message, 'error');
                }
                throw err;
            }
        }

        async function setAudioOutput(useSpeaker) {
            const remoteAudio = document.getElementById('remoteAudio');
            if (typeof remoteAudio.setSinkId === 'function') {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
                    if (audioOutputs.length > 1) {
                        // Try to use the second device for speaker, first for earpiece
                        const deviceId = useSpeaker ? 
                            audioOutputs.find(d => d.label.toLowerCase().includes('speaker'))?.deviceId || audioOutputs[1].deviceId :
                            audioOutputs.find(d => d.label.toLowerCase().includes('earpiece'))?.deviceId || audioOutputs[0].deviceId;
                        if (deviceId) {
                            await remoteAudio.setSinkId(deviceId);
                        }
                    }
                } catch (e) {
                    console.warn('Audio output change not supported:', e);
                }
            }
        }

        function setupAudioLevelMonitoring() {
            if (!localStream) return;
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                source.connect(analyser);
                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function updateLevel() {
                    analyser.getByteFrequencyData(dataArray);
                    let average = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                    const level = Math.min((average / 128) * 100, 100);
                    const bar = document.getElementById('audioLevelBar');
                    if (bar) {
                        bar.style.width = level + '%';
                    }
                    if (localStream && !isEndingCall) {
                        requestAnimationFrame(updateLevel);
                    }
                }
                updateLevel();
            } catch (e) {
                console.warn('Audio level monitoring not supported:', e);
            }
        }

        function monitorConnectionQuality() {
            if (!peerConnection) return;
            
            if (qualityMonitorInterval) {
                clearInterval(qualityMonitorInterval);
            }
            
            qualityMonitorInterval = setInterval(async () => {
                try {
                    if (!peerConnection || peerConnection.connectionState === 'closed' || peerConnection.connectionState === 'disconnected') {
                        return;
                    }
                    
                    const stats = await peerConnection.getStats();
                    let packetsLost = 0;
                    let totalPackets = 0;
                    let jitter = 0;
                    
                    stats.forEach(stat => {
                        if (stat.type === 'inbound-rtp' && stat.kind === 'audio') {
                            packetsLost = stat.packetsLost || 0;
                            totalPackets = stat.packetsReceived + packetsLost;
                            jitter = stat.jitter || 0;
                        }
                    });
                    
                    const qualityDot = document.querySelector('.quality-dot');
                    const qualityText = document.querySelector('.quality-text');
                    
                    if (totalPackets > 0) {
                        const lossRatio = packetsLost / totalPackets;
                        if (lossRatio < 0.01 && jitter < 20) {
                            qualityDot.className = 'quality-dot good';
                            qualityText.textContent = 'Good';
                        } else if (lossRatio < 0.05 && jitter < 50) {
                            qualityDot.className = 'quality-dot poor';
                            qualityText.textContent = 'Fair';
                        } else {
                            qualityDot.className = 'quality-dot bad';
                            qualityText.textContent = 'Poor';
                        }
                    }
                } catch (e) {
                    console.warn('Stats monitoring error:', e);
                }
            }, 5000);
        }

        function startCallTimer() {
            if (timerInterval) return;
            let seconds = 0;
            const timerElement = document.getElementById("callTimer");
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopCallTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        async function cleanupAndExit(redirect = true) {
            isEndingCall = true;
            stopCallTimer();
            
            if (qualityMonitorInterval) {
                clearInterval(qualityMonitorInterval);
                qualityMonitorInterval = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (peerConnection) {
                try {
                    peerConnection.close();
                } catch (e) {
                    console.warn('Peer connection close error:', e);
                }
                peerConnection = null;
            }
            
            releaseWakeLock();
            
            // Remove remote audio reference
            const remoteAudio = document.getElementById('remoteAudio');
            if (remoteAudio) {
                remoteAudio.srcObject = null;
            }
            
            if (redirect) {
                showToast("Call ended", 'success');
                vibrate(100);
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 500);
            }
        }

        async function reconnectCall() {
            if (isReconnecting) return;
            
            if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                showToast("Call ended due to connection issues", 'error');
                await cleanupAndExit();
                return;
            }
            
            isReconnecting = true;
            reconnectAttempts++;
            showToast(`Reconnecting... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`, 'info');
            
            try {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                
                // Recreate peer connection
                peerConnection = new RTCPeerConnection(servers);
                
                // Re-add tracks
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }
                
                // Set up event handlers
                const offerCandidates = collection(callDocRef, 'offerCandidates');
                const answerCandidates = collection(callDocRef, 'answerCandidates');
                
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        const collection = isCaller ? offerCandidates : answerCandidates;
                        addDoc(collection, event.candidate.toJSON()).catch(e => console.warn('ICE candidate error:', e));
                    }
                };
                
                peerConnection.ontrack = (event) => {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                    if (!timerInterval) {
                        startCallTimer();
                        setCallStatus("Secure Voice Call");
                        vibrate([200, 100, 200]);
                    }
                };
                
                // Re-establish connection based on role
                if (isCaller) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    await updateDoc(callDocRef, {
                        offer: { type: offer.type, sdp: offer.sdp }
                    });
                } else {
                    const callSnapshot = await getDoc(callDocRef);
                    const callData = callSnapshot.data();
                    if (callData && callData.offer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        await updateDoc(callDocRef, {
                            answer: { type: answer.type, sdp: answer.sdp }
                        });
                    }
                }
                
                isReconnecting = false;
                setCallStatus("Reconnected");
                showToast("Call reconnected", 'success');
                
            } catch (err) {
                console.error('Reconnection failed:', err);
                isReconnecting = false;
                
                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    setTimeout(() => reconnectCall(), 2000);
                } else {
                    showToast("Unable to reconnect call", 'error');
                    await cleanupAndExit();
                }
            }
        }

        async function terminateCall() {
            if (isEndingCall) return;
            
            try {
                if (callDocRef) {
                    await updateDoc(callDocRef, { 
                        ended: true,
                        endedAt: new Date().toISOString()
                    });
                }
            } catch (e) {
                console.warn('Failed to update call end status:', e);
            }
            
            await cleanupAndExit();
        }

        async function startCall(userId, calleeName) {
            setCallStatus("Calling...", true);
            callDocRef = doc(collection(db, 'calls'));
            
            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                startCallTimer();
                setCallStatus("Secure Voice Call");
                vibrate([200, 100, 200]);
                requestWakeLock();
                monitorConnectionQuality();
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'disconnected' || 
                    peerConnection.connectionState === 'failed') {
                    if (!isEndingCall) {
                        handleDisconnection();
                    }
                }
            };

            const offerCandidates = collection(callDocRef, 'offerCandidates');
            const answerCandidates = collection(callDocRef, 'answerCandidates');

            peerConnection.onicecandidate = (event) => {
                event.candidate && addDoc(offerCandidates, event.candidate.toJSON());
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            const callData = {
                offer: { type: offer.type, sdp: offer.sdp },
                callerId: userId,
                callerName: calleeName,
                createdAt: new Date().toISOString(),
                active: true
            };

            await setDoc(callDocRef, callData);

            // Listen for remote answer
            const unsubscribe = onSnapshot(callDocRef, (snapshot) => {
                const data = snapshot.data();
                if (!data) return;
                
                if (!peerConnection.currentRemoteDescription && data.answer) {
                    const answer = new RTCSessionDescription(data.answer);
                    peerConnection.setRemoteDescription(answer);
                    setCallStatus("Secure Voice Call");
                    startCallTimer();
                    vibrate([200, 100, 200]);
                    requestWakeLock();
                    monitorConnectionQuality();
                }
                
                if (data.ended) {
                    unsubscribe();
                    cleanupAndExit();
                }
            });

            // Listen for remote ICE candidates
            const unsubscribeCandidates = onSnapshot(answerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added' && peerConnection) {
                        try {
                            const candidate = new RTCIceCandidate(change.doc.data());
                            peerConnection.addIceCandidate(candidate);
                        } catch (e) {
                            console.warn('ICE candidate add error:', e);
                        }
                    }
                });
            });
            
            // Store unsubscribe functions for cleanup
            window.__callUnsubscribes = [unsubscribe, unsubscribeCandidates];
        }

        async function joinCall(callId) {
            setCallStatus("Connecting...", true);
            peerConnection = new RTCPeerConnection(servers);

            localStream.getTracks().forEach((track) => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                startCallTimer();
                setCallStatus("Secure Voice Call");
                vibrate([200, 100, 200]);
                requestWakeLock();
                monitorConnectionQuality();
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === 'disconnected' || 
                    peerConnection.connectionState === 'failed') {
                    if (!isEndingCall) {
                        handleDisconnection();
                    }
                }
            };

            const offerCandidates = collection(callDocRef, 'offerCandidates');
            const answerCandidates = collection(callDocRef, 'answerCandidates');

            peerConnection.onicecandidate = (event) => {
                event.candidate && addDoc(answerCandidates, event.candidate.toJSON());
            };

            const callSnapshot = await getDoc(callDocRef);
            const callData = callSnapshot.data();

            if (!callData || !callData.offer) {
                showToast("Call session not found or ended.", 'error');
                setTimeout(() => window.location.href = "index.html", 1500);
                return;
            }

            const offer = callData.offer;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await updateDoc(callDocRef, {
                answer: { type: answer.type, sdp: answer.sdp }
            });

            // Listen for remote ICE candidates
            const unsubscribeCandidates = onSnapshot(offerCandidates, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added' && peerConnection) {
                        try {
                            let data = change.doc.data();
                            peerConnection.addIceCandidate(new RTCIceCandidate(data));
                        } catch (e) {
                            console.warn('ICE candidate add error:', e);
                        }
                    }
                });
            });

            const unsubscribeCall = onSnapshot(callDocRef, (snapshot) => {
                const data = snapshot.data();
                if (data && data.ended) {
                    unsubscribeCall();
                    unsubscribeCandidates();
                    cleanupAndExit();
                }
            });
            
            window.__callUnsubscribes = [unsubscribeCall, unsubscribeCandidates];
        }

        function handleDisconnection() {
            if (isEndingCall || isReconnecting) return;
            
            setCallStatus("Connection lost", true, true);
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            setTimeout(() => {
                if (!isEndingCall) {
                    reconnectCall();
                }
            }, 2000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Permission retry button
            document.getElementById('retryPermissionBtn').addEventListener('click', async () => {
                try {
                    localStream = await requestMicrophone();
                    if (localStream) {
                        setupAudioLevelMonitoring();
                        // Re-init call setup after permission granted
                        initializeCall();
                    }
                } catch (e) {
                    console.error('Permission retry failed:', e);
                }
            });

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "login.html";
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                const calleeName = urlParams.get('name') || "Alex Morgan";
                const callId = urlParams.get('id');
                const callerName = urlParams.get('caller') || user.displayName || 'User';

                if (!callId && !calleeName) {
                    showToast("Invalid call parameters", 'error');
                    setTimeout(() => window.location.href = "index.html", 1500);
                    return;
                }

                const avatarInitials = calleeName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById("callerName").textContent = calleeName;
                document.getElementById("callerAvatar").textContent = avatarInitials;
                document.getElementById("callerIdDisplay").textContent = `📱 ${callerName}`;

                try {
                    localStream = await requestMicrophone();
                    if (localStream) {
                        setupAudioLevelMonitoring();
                    }
                } catch (err) {
                    console.error("Microphone permission denied:", err);
                    return;
                }

                if (callId) {
                    isCaller = false;
                    callDocRef = doc(db, 'calls', callId);
                    await joinCall(callId);
                } else {
                    isCaller = true;
                    await startCall(user.uid, calleeName);
                }
            });

            // Control Buttons Interaction
            const muteBtn = document.getElementById("muteBtn");
            const speakerBtn = document.getElementById("speakerBtn");
            const endCallBtn = document.getElementById("endCallBtn");

            let isMuted = false;
            let isSpeakerOn = false;

            muteBtn.addEventListener("click", () => {
                if (localStream) {
                    const audioTrack = localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        isMuted = !isMuted;
                        audioTrack.enabled = !isMuted;
                        muteBtn.classList.toggle("active", isMuted);
                        showToast(isMuted ? "Microphone muted" : "Microphone unmuted", 'info');
                        vibrate(50);
                    }
                }
            });

            speakerBtn.addEventListener("click", () => {
                isSpeakerOn = !isSpeakerOn;
                speakerBtn.classList.toggle("active", isSpeakerOn);
                setAudioOutput(isSpeakerOn);
                showToast(isSpeakerOn ? "Speaker enabled" : "Earpiece enabled", 'info');
                vibrate(50);
            });

            endCallBtn.addEventListener("click", async () => {
                vibrate(100);
                await terminateCall();
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'm' || e.key === 'M') {
                    muteBtn.click();
                    e.preventDefault();
                }
                if (e.key === 's' || e.key === 'S') {
                    speakerBtn.click();
                    e.preventDefault();
                }
                if (e.key === 'Escape') {
                    endCallBtn.click();
                    e.preventDefault();
                }
            });

            // Handle page visibility change - keep connection alive
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && wakeLock) {
                    // Screen is hidden, but keep wake lock if we have it
                } else if (!document.hidden && !wakeLock && peerConnection && peerConnection.connectionState === 'connected') {
                    // Page became visible again, re-request wake lock
                    requestWakeLock();
                }
            });

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (peerConnection && peerConnection.connectionState !== 'closed') {
                    try {
                        peerConnection.close();
                    } catch (e) {}
                }
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                stopCallTimer();
                releaseWakeLock();
                if (window.__callUnsubscribes) {
                    window.__callUnsubscribes.forEach(unsub => {
                        try { unsub(); } catch (e) {}
                    });
                }
            });
        });

        // Helper function to initialize call after permission
        async function initializeCall() {
            const urlParams = new URLSearchParams(window.location.search);
            const calleeName = urlParams.get('name') || "Alex Morgan";
            const callId = urlParams.get('id');
            const user = auth.currentUser;
            
            if (!user) return;
            
            if (callId) {
                isCaller = false;
                callDocRef = doc(db, 'calls', callId);
                await joinCall(callId);
            } else {
                isCaller = true;
                await startCall(user.uid, calleeName);
            }
        }
    </script>
</head>
<body>

    <!-- Hidden Audio Element for WebRTC Real-Time Voice Stream -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <!-- Permission Request Overlay -->
    <div id="permissionOverlay" class="permission-overlay">
        <div class="permission-card">
            <h2>🎤 Microphone Access</h2>
            <p>This call requires microphone access to work properly. Please grant permission to continue.</p>
            <button id="retryPermissionBtn" class="permission-btn">Allow Microphone</button>
        </div>
    </div>

    <!-- Top Header Bar -->
    <header class="call-header">
        <a href="index.html" class="back-btn" title="Back" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div id="statusBadge" class="call-status-badge connecting">
            <span class="status-dot"></span>
            <span id="statusText">Initializing...</span>
        </div>
        <div class="call-info-panel">
            <span id="callerIdDisplay">📱 User</span>
            <span class="encryption-status">🔒 Encrypted</span>
        </div>
    </header>

    <!-- Center Call Avatar & Timer -->
    <main class="call-center">
        <div class="avatar-container">
            <div class="ripple"></div>
            <div class="ripple"></div>
            <div class="ripple"></div>
            <div id="callerAvatar" class="caller-avatar">AM</div>
        </div>
        
        <div class="caller-info">
            <h1 id="callerName" class="caller-name">Alex Morgan</h1>
            <p id="callTimer" class="call-timer">00:00</p>
            <div class="connection-quality">
                <span class="quality-dot good"></span>
                <span class="quality-text">Good</span>
            </div>
            <div class="audio-level-container">
                <div id="audioLevelBar" class="audio-level-bar"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Call Control Buttons -->
    <footer class="call-controls">
        <!-- Mute Button -->
        <button id="muteBtn" class="control-btn" title="Mute (M)" aria-label="Mute microphone">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <!-- End Call Button -->
        <button id="endCallBtn" class="control-btn end-call" title="End Call (Esc)" aria-label="End call">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.33a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
        </button>

        <!-- Speaker / Audio Output Button -->
        <button id="speakerBtn" class="control-btn" title="Speaker (S)" aria-label="Toggle speaker">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
    </footer>

    <!-- Global Toast Notification Component -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div id="toastIcon" class="toast-icon">ℹ</div>
            <div id="toastText" class="toast-text">Action completed successfully.</div>
        </div>
    </div>

</body>
</html>
