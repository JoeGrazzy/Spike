<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice Record — SPIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #090A0F;
            --bg-surface: #121520;
            --bg-card: rgba(25, 30, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --accent: #EC4899;
            --error: #EF4444;
            --success: #10B981;
            --warning: #EAB308;
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            height: 100dvh;
            padding: 24px 16px;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.12;
            pointer-events: none;
        }
        body::before {
            top: -100px;
            left: -100px;
            background: var(--primary);
        }
        body::after {
            bottom: -100px;
            right: -100px;
            background: var(--accent);
        }

        /* Top Bar */
        .record-header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            z-index: 10;
        }

        .back-btn {
            background: rgba(25, 30, 46, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .back-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .recipient-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        /* Center Content */
        .record-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex: 1;
            width: 100%;
            max-width: 420px;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            transition: var(--transition);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-container.recording {
            animation: pulse-avatar 1.2s infinite;
        }

        @keyframes pulse-avatar {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .recipient-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
        }

        .record-timer {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
        }

        .record-timer.warning {
            color: var(--error);
            animation: pulse-timer 1s infinite;
        }

        @keyframes pulse-timer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Audio Visualizer Canvas */
        .visualizer-card {
            width: 100%;
            max-width: 340px;
            height: 80px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }

        .visualizer-card.recording {
            border-color: var(--error);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.2);
        }

        canvas#waveformCanvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Recording duration warning */
        .duration-warning {
            color: var(--warning);
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0;
            transition: var(--transition);
            margin-top: -8px;
        }

        .duration-warning.visible {
            opacity: 1;
        }

        /* Controls Bottom Bar */
        .record-controls {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            z-index: 10;
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .control-btn.discard-btn {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .control-btn.discard-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .control-btn.record-btn {
            width: 72px;
            height: 72px;
            background: var(--error);
            border-color: var(--error);
            color: white;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5);
        }

        .control-btn.record-btn:hover {
            background: #dc2626;
        }

        .control-btn.record-btn.recording {
            animation: pulse-recording 1.5s infinite;
        }

        @keyframes pulse-recording {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .control-btn.send-btn {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            opacity: 0.4;
            pointer-events: none;
            transition: var(--transition);
        }

        .control-btn.send-btn.ready {
            opacity: 1;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .control-btn.send-btn.ready:hover {
            background: var(--primary-hover);
        }

        .control-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--bg-deep);
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        /* Permission Overlay */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .permission-overlay.active {
            display: flex;
        }

        .permission-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        .permission-card h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .permission-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .permission-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-main);
        }

        .permission-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .permission-btn:active {
            transform: scale(0.98);
        }

        /* Toast Component */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 400px;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            pointer-events: none;
        }

        .toast-container.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast-content {
            background: rgba(18, 21, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            flex-shrink: 0;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .toast-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .toast-icon.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .toast-text {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-main);
            flex: 1;
            line-height: 1.3;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .recipient-name {
                font-size: 1.2rem;
            }

            .avatar-container {
                width: 80px;
                height: 80px;
                font-size: 1.8rem;
            }

            .record-timer {
                font-size: 1.8rem;
            }

            .control-btn {
                width: 48px;
                height: 48px;
            }

            .control-btn.record-btn {
                width: 64px;
                height: 64px;
            }

            .visualizer-card {
                height: 60px;
                padding: 8px;
            }

            .record-controls {
                gap: 14px;
            }
        }

        @media (max-width: 380px) {
            .recipient-name {
                font-size: 1rem;
            }

            .avatar-container {
                width: 70px;
                height: 70px;
                font-size: 1.5rem;
            }

            .record-timer {
                font-size: 1.5rem;
            }

            .control-btn {
                width: 42px;
                height: 42px;
            }

            .control-btn.record-btn {
                width: 56px;
                height: 56px;
            }

            .visualizer-card {
                height: 50px;
                padding: 6px;
            }

            .record-controls {
                gap: 10px;
            }
        }

        /* Landscape mode optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            .record-center {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
                padding: 0 16px;
            }

            .avatar-container {
                width: 60px;
                height: 60px;
                font-size: 1.2rem;
            }

            .recipient-name {
                font-size: 1rem;
            }

            .record-timer {
                font-size: 1.2rem;
            }

            .visualizer-card {
                height: 40px;
                max-width: 200px;
            }

            .record-controls {
                padding-bottom: 10px;
            }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuration
        const CLOUDINARY_CLOUD_NAME = "dxld01rcp";
        const CLOUDINARY_UPLOAD_PRESET = "Storage_preset";

        const firebaseConfig = {
            apiKey: "AIzaSyAm8ghbQ_lwJdNXEhWGos0eyi5wtvGuRR4",
            authDomain: "grazzy-9e736.firebaseapp.com",
            projectId: "grazzy-9e736",
            storageBucket: "grazzy-9e736.firebasestorage.app",
            messagingSenderId: "750326949170",
            appId: "1:750326949170:web:5d19744aafc8675918632b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        let recordingTimer = null;
        let recordSeconds = 0;
        let isRecording = false;
        let isPaused = false;

        let audioCtx = null;
        let analyser = null;
        let animFrameId = null;

        let currentUserId = null;
        let targetUserId = null;
        let targetUserData = null;

        const MAX_RECORDING_DURATION = 60; // seconds

        let toastTimeout;

        function showToast(message, type = 'info') {
            const toast = document.getElementById('globalToast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = 'toast-container active';
            toastText.textContent = message;
            
            toastIcon.className = 'toast-icon';
            if (type === 'error') {
                toastIcon.classList.add('error');
                toastIcon.textContent = '✕';
            } else if (type === 'success') {
                toastIcon.classList.add('success');
                toastIcon.textContent = '✓';
            } else {
                toastIcon.textContent = 'ℹ';
            }

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        function displayContactInfo(name, photoUrl) {
            const nameEl = document.getElementById("recipientName");
            const avatarEl = document.getElementById("recipientAvatar");
            
            const displayName = (name && name.trim() !== "" && name !== "null") ? name : "Recipient";
            nameEl.textContent = displayName;
            
            if (photoUrl && photoUrl.trim() !== "" && photoUrl !== "null") {
                avatarEl.innerHTML = `<img src="${photoUrl}" alt="${displayName}" onerror="this.onerror=null; this.parentNode.innerHTML='${getInitials(displayName)}';">`;
            } else {
                avatarEl.textContent = getInitials(displayName);
            }
        }

        function getInitials(name) {
            if (!name) return "??";
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        async function loadExactUserProfile(uid, paramName, paramPhoto) {
            let finalName = paramName || "";
            let finalPhoto = paramPhoto || "";

            if (uid) {
                try {
                    const userSnap = await getDoc(doc(db, 'users', uid));
                    if (userSnap.exists()) {
                        const data = userSnap.data();
                        finalName = data.name || data.displayName || data.username || finalName;
                        finalPhoto = data.photoURL || data.profilePicture || data.avatar || finalPhoto;
                        targetUserData = data;
                    }
                } catch (err) {
                    console.error("Firestore user query error:", err);
                }
            }

            if (!finalName || finalName === "null") finalName = "User";
            displayContactInfo(finalName, finalPhoto);
        }

        function showPermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.add('active');
        }

        function hidePermissionRequestUI() {
            document.getElementById('permissionOverlay').classList.remove('active');
        }

        async function requestMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                hidePermissionRequestUI();
                return stream;
            } catch (err) {
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    showToast("Please allow microphone access in your browser settings", 'error');
                    showPermissionRequestUI();
                } else if (err.name === 'NotFoundError') {
                    showToast("No microphone found on this device", 'error');
                } else {
                    showToast("Microphone error: " + err.message, 'error');
                }
                throw err;
            }
        }

        function setupVisualizer(stream) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);

            analyser.fftSize = 64;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const canvas = document.getElementById("waveformCanvas");
            const canvasCtx = canvas.getContext("2d");
            
            // Set canvas size
            canvas.width = canvas.clientWidth * 2;
            canvas.height = canvas.clientHeight * 2;
            canvasCtx.scale(2, 2);

            function draw() {
                animFrameId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                const width = canvas.width / 2;
                const height = canvas.height / 2;
                
                canvasCtx.clearRect(0, 0, width, height);

                const barWidth = (width / bufferLength) * 1.5;
                let x = 0;

                const gradient = canvasCtx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, '#6366F1');
                gradient.addColorStop(1, '#EC4899');

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * height * 0.9;
                    canvasCtx.fillStyle = gradient;
                    canvasCtx.beginPath();
                    canvasCtx.roundRect(x, height - barHeight, barWidth, barHeight, 2);
                    canvasCtx.fill();
                    x += barWidth + 2;
                }
            }
            draw();
        }

        function clearCanvas() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            const canvas = document.getElementById("waveformCanvas");
            const canvasCtx = canvas.getContext("2d");
            const width = canvas.width / 2;
            const height = canvas.height / 2;
            canvasCtx.clearRect(0, 0, width, height);
        }

        function startTimer() {
            recordSeconds = 0;
            const timerEl = document.getElementById("recordTimer");
            const warningEl = document.getElementById("durationWarning");
            
            recordingTimer = setInterval(() => {
                recordSeconds++;
                const mins = Math.floor(recordSeconds / 60);
                const secs = recordSeconds % 60;
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                // Show warning when approaching limit
                if (recordSeconds >= MAX_RECORDING_DURATION - 10) {
                    timerEl.classList.add('warning');
                    warningEl.classList.add('visible');
                    if (recordSeconds >= MAX_RECORDING_DURATION) {
                        showToast("Maximum recording duration reached", 'warning');
                        stopRecordingState();
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }
            document.getElementById("recordTimer").classList.remove('warning');
            document.getElementById("durationWarning").classList.remove('visible');
        }

        function resetRecording() {
            stopRecordingState();
            audioBlob = null;
            audioChunks = [];
            recordSeconds = 0;
            document.getElementById("recordTimer").textContent = "00:00";
            document.getElementById("sendBtn").classList.remove("ready");
            clearCanvas();
            document.getElementById("visualizerCard").classList.remove('recording');
            document.getElementById("avatarContainer").classList.remove('recording');
            showToast("Recording cleared", 'info');
            vibrate(50);
        }

        function stopRecordingState() {
            const recordBtn = document.getElementById("recordBtn");
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            isPaused = false;
            recordBtn.classList.remove("recording");
            recordBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
            stopTimer();
            document.getElementById("visualizerCard").classList.remove('recording');
            document.getElementById("avatarContainer").classList.remove('recording');
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        async function toggleRecording() {
            const recordBtn = document.getElementById("recordBtn");

            if (!isRecording) {
                try {
                    const stream = await requestMicrophone();
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) {
                            audioChunks.push(e.data);
                        }
                    };
                    
                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            document.getElementById("sendBtn").classList.add("ready");
                            showToast("Recording ready to send", 'success');
                            vibrate(100);
                        }
                    };

                    setupVisualizer(stream);
                    mediaRecorder.start(100); // Collect data every 100ms

                    isRecording = true;
                    recordBtn.classList.add("recording");
                    recordBtn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
                    document.getElementById("visualizerCard").classList.add('recording');
                    document.getElementById("avatarContainer").classList.add('recording');
                    startTimer();
                    showToast("Recording started...", 'info');
                    vibrate(50);
                } catch (err) {
                    console.error("Microphone access error:", err);
                }
            } else {
                stopRecordingState();
                showToast("Recording stopped", 'info');
                vibrate(50);
            }
        }

        async function uploadAndSendVoiceNote() {
            if (!audioBlob) {
                showToast("Please record audio first.", 'error');
                return;
            }

            if (!targetUserId) {
                showToast("Recipient not found.", 'error');
                return;
            }

            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;
            sendBtn.style.opacity = '0.5';

            showToast("Uploading voice note...", 'info');

            try {
                // Upload directly to Cloudinary
                const formData = new FormData();
                formData.append("file", audioBlob, `voicenote_${Date.now()}.webm`);
                formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
                formData.append("resource_type", "video");

                const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (!res.ok || !data.secure_url) {
                    throw new Error(data.error?.message || "Cloudinary upload failed");
                }

                const audioUrl = data.secure_url;

                // Save record reference in Firestore
                const messageRef = await addDoc(collection(db, "messages"), {
                    senderId: currentUserId,
                    recipientId: targetUserId,
                    type: "audio",
                    mediaUrl: audioUrl,
                    duration: recordSeconds,
                    timestamp: serverTimestamp(),
                    read: false,
                    delivered: false
                });

                // Update user's last message
                await updateDoc(doc(db, 'users', currentUserId), {
                    lastMessage: {
                        text: "🎤 Voice note",
                        timestamp: serverTimestamp(),
                        recipientId: targetUserId
                    }
                });

                showToast("Voice note sent successfully!", 'success');
                vibrate([100, 50, 100]);
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1200);

            } catch (err) {
                console.error("Upload Error:", err);
                showToast("Failed to upload voice note: " + err.message, 'error');
                sendBtn.disabled = false;
                sendBtn.style.opacity = '1';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Permission retry button
            document.getElementById('retryPermissionBtn').addEventListener('click', async () => {
                try {
                    await requestMicrophone();
                    showToast("Microphone access granted", 'success');
                } catch (e) {
                    console.error('Permission retry failed:', e);
                }
            });

            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = "login.html";
                    return;
                }
                currentUserId = user.uid;

                const urlParams = new URLSearchParams(window.location.search);
                targetUserId = urlParams.get('userId') || urlParams.get('uid') || urlParams.get('calleeId');
                const rawName = urlParams.get('name');
                const rawPhoto = urlParams.get('photo') || urlParams.get('avatar');

                if (!targetUserId) {
                    showToast("Invalid recipient", 'error');
                    setTimeout(() => window.location.href = "index.html", 1500);
                    return;
                }

                await loadExactUserProfile(targetUserId, rawName, rawPhoto);
            });

            const recordBtn = document.getElementById("recordBtn");
            const discardBtn = document.getElementById("discardBtn");
            const sendBtn = document.getElementById("sendBtn");

            recordBtn.addEventListener("click", toggleRecording);
            discardBtn.addEventListener("click", resetRecording);
            sendBtn.addEventListener("click", uploadAndSendVoiceNote);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    recordBtn.click();
                }
                if (e.key === 'Enter' && sendBtn.classList.contains('ready')) {
                    sendBtn.click();
                }
                if (e.key === 'Escape') {
                    discardBtn.click();
                }
            });

            // Handle page visibility change
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isRecording) {
                    // Auto-stop recording if page is hidden
                    stopRecordingState();
                    showToast("Recording stopped", 'info');
                }
            });

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                }
                stopTimer();
                if (audioCtx) {
                    audioCtx.close();
                }
            });
        });

        // RoundRect polyfill for older browsers
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }
    </script>
</head>
<body>

    <!-- Permission Request Overlay -->
    <div id="permissionOverlay" class="permission-overlay">
        <div class="permission-card">
            <h2>🎤 Microphone Access</h2>
            <p>This voice recorder requires microphone access. Please grant permission to continue.</p>
            <button id="retryPermissionBtn" class="permission-btn">Allow Microphone</button>
        </div>
    </div>

    <header class="record-header">
        <a href="index.html" class="back-btn" title="Back" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="recipient-badge">
            <span>Voice Note</span>
        </div>
    </header>

    <main class="record-center">
        <div id="avatarContainer" class="avatar-container">
            <span id="recipientAvatar"></span>
        </div>
        <h1 id="recipientName" class="recipient-name">Recipient</h1>
        <div id="recordTimer" class="record-timer">00:00</div>
        <div id="durationWarning" class="duration-warning">⚠️ Max 60 seconds</div>

        <div id="visualizerCard" class="visualizer-card">
            <canvas id="waveformCanvas"></canvas>
        </div>
    </main>

    <footer class="record-controls">
        <!-- Discard / Reset Button -->
        <button id="discardBtn" class="control-btn discard-btn" title="Discard (Esc)" aria-label="Discard recording">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>

        <!-- Record / Pause Button -->
        <button id="recordBtn" class="control-btn record-btn" title="Record (Space)" aria-label="Record audio">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>

        <!-- Send Button -->
        <button id="sendBtn" class="control-btn send-btn" title="Send Voice Note (Enter)" aria-label="Send voice note">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </footer>

    <!-- Global Toast Component -->
    <div id="globalToast" class="toast-container">
        <div class="toast-content">
            <div id="toastIcon" class="toast-icon">ℹ</div>
            <div id="toastText" class="toast-text"></div>
        </div>
    </div>

</body>
</html>
